<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TezkorRENT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 54px 14px 28px; min-height: 100dvh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top right, #0f2942, #070b14 60%); color: #f1f5f9;
    }
    .top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
    .brand { font-size: 19px; font-weight: 900; background: linear-gradient(90deg, #38bdf8, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .adm-btn {
      background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none;
      padding: 8px 13px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .hero {
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 18px; padding: 14px; margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .stat-pill { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.35); padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }

    .acc-card {
      background: rgba(17, 25, 42, 0.85); border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 20px; padding: 15px; margin-bottom: 13px; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
    }
    .acc-card.busy { border-color: rgba(244, 63, 94, 0.5); opacity: 0.82; }
    .tag {
      display: inline-block; background: rgba(56, 189, 248, 0.12); color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.25); padding: 4px 9px; border-radius: 8px; font-size: 11px; font-weight: 600; margin: 3px 4px 3px 0;
    }
    .price-box {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.06);
      padding: 10px 12px; border-radius: 12px; margin: 11px 0; font-size: 13px;
    }
    .btn-rent {
      width: 100%; padding: 13px; border: none; border-radius: 13px;
      background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff;
      font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35);
    }
    .btn-busy {
      width: 100%; padding: 12px; border: 1px solid rgba(244, 63, 94, 0.4); border-radius: 13px;
      background: rgba(136, 19, 55, 0.45); color: #fda4af; font-weight: 800; font-size: 13px;
    }
    .empty-box {
      text-align: center; padding: 34px 18px; background: rgba(255,255,255,0.04);
      border: 1px dashed rgba(148,163,184,0.3); border-radius: 18px; color: #94a3b8; font-size: 13px; line-height: 1.5;
    }

    .modal-bg { position: fixed; inset: 0; background: rgba(4, 8, 16, 0.82); backdrop-filter: blur(6px); display: none; align-items: flex-end; z-index: 30; }
    .modal-bg.open { display: flex; }
    .modal { width: 100%; background: #0f172a; border-top: 2px solid #38bdf8; border-radius: 22px 22px 0 0; padding: 18px; }
    .dur-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .dur-btn { padding: 11px; border-radius: 12px; border: 1.5px solid #1e293b; background: #1e293b; color: #e2e8f0; font-weight: 700; font-size: 13px; cursor: pointer; }
    .dur-btn.on { border-color: #10b981; background: rgba(16, 185, 129, 0.18); color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="top-row">
    <div class="brand">⚡ TezkorRENT</div>
    <button class="adm-btn" onclick="contactAdmin()">📞 Admin bilan bog‘lanish</button>
  </div>

  <div class="hero">
    <div>
      <div style="font-weight:800;font-size:14px;">PUBG Mobile Arenda</div>
      <div style="font-size:11px;color:#94a3b8;margin-top:2px;">Tanlang — videosi va karta botga keladi</div>
    </div>
    <div class="stat-pill" id="cnt-pill">0 ta</div>
  </div>

  <div id="acc-list"></div>

  <div class="modal-bg" id="m-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b id="m-title" style="font-size:15px;color:#7dd3fc;"></b>
        <button onclick="closeModal()" style="background:#1e293b;color:#fff;border:none;border-radius:8px;padding:6px 11px;">✕</button>
      </div>
      <div class="dur-grid" id="dur-grid"></div>
      <div style="background:#1e293b;padding:11px;border-radius:12px;font-size:12px;margin-bottom:12px;">
        💳 <b>Jami narx:</b> <span id="m-total" style="color:#34d399;font-weight:800;">0</span> so‘m<br>
        <span style="color:#94a3b8;">Tugmani bossangiz botga akkaunt videosi va karta boradi.</span>
      </div>
      <button class="btn-rent" onclick="confirmRent()">📩 Akkauntni olish</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    try { if (tg) { tg.ready(); tg.expand(); } } catch (e) {}
    const qs = new URLSearchParams(window.location.search);
    const botUser = qs.get('bot') || '';
    const admUser = qs.get('adm') || '';
    const fbUrl = qs.get('fb') || '';
    const dParam = qs.get('d') || '';

    let ACCOUNTS = [];

    function contactAdmin() {
      if (admUser && tg && tg.openTelegramLink) tg.openTelegramLink('https://t.me/' + admUser);
      else if (botUser && tg && tg.openTelegramLink) tg.openTelegramLink('https://t.me/' + botUser + '?start=contact');
      else alert('Admin bilan bog‘lanish uchun botga yozing!');
    }

    function decodeData(str) {
      try {
        let s = str.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        const bin = atob(s);
        const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
        return JSON.parse(new TextDecoder().decode(bytes));
      } catch (e) { return []; }
    }

    async function loadAccs() {
      if (fbUrl) {
        try {
          const r = await fetch(fbUrl + '/arenda_accs.json');
          const d = await r.json();
          if (d) ACCOUNTS = Object.values(d);
        } catch (e) {}
      }
      if (ACCOUNTS.length === 0 && dParam) {
        ACCOUNTS = decodeData(dParam);
      }
      renderAccs();
    }

    function renderAccs() {
      const freeCnt = ACCOUNTS.filter(a => !a.busy).length;
      document.getElementById('cnt-pill').innerText = 'Bo‘sh: ' + freeCnt + ' ta';
      const box = document.getElementById('acc-list');
      if (ACCOUNTS.length === 0) {
        box.innerHTML = '<div class="empty-box">📭 Hozircha akkauntlar qo‘shilmagan.<br>Admin botdan yangi akkaunt qo‘shgach, hammasi shu yerda chiqadi!</div>';
        return;
      }
      box.innerHTML = ACCOUNTS.map(a => {
        const tags = String(a.details || '').split(',').filter(Boolean).map(s=>'<span class="tag">'+s.trim()+'</span>').join('');
        const btn = a.busy
          ? '<button class="btn-busy" onclick="alert(\'⛔ Bu akkauntni boshqa odam xarid qilgan!\')">🔒 Boshqa odam xarid qilgan</button>'
          : '<button class="btn-rent" onclick="openRent(\''+a.id+'\')">🔑 Akkauntni olish</button>';
        return '<div class="acc-card '+(a.busy?'busy':'')+'">' +
          '<b style="font-size:15px;color:#f8fafc;">'+a.title+'</b>' +
          '<div style="font-size:11px;color:#94a3b8;margin:3px 0 8px;">ID: '+a.id+'</div>' +
          '<div>'+tags+'</div>' +
          '<div class="price-box"><span>⏱️ Muddat: <b>'+(a.hours||1)+' soat</b></span><span style="color:#34d399;font-weight:800;">'+Number(a.price).toLocaleString()+' so‘m</span></div>' +
          btn + '</div>';
      }).join('');
    }

    let selAcc = null, selHrs = 1;
    function openRent(id) {
      selAcc = ACCOUNTS.find(x=>x.id===id);
      if (!selAcc || selAcc.busy) return alert('⛔ Bu akkauntni boshqa odam xarid qilgan!');
      selHrs = Number(selAcc.hours || 1);
      document.getElementById('m-title').innerText = selAcc.title;
      renderDur();
      document.getElementById('m-bg').classList.add('open');
    }
    function closeModal() { document.getElementById('m-bg').classList.remove('open'); }
    function calcPrice(h) {
      const base = Number(selAcc.price), h0 = Number(selAcc.hours || 1);
      return Math.round((base / h0) * h);
    }
    function renderDur() {
      const h0 = Number(selAcc.hours || 1);
      const opts = [h0, h0*2, h0*3, 24].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);
      document.getElementById('dur-grid').innerHTML = opts.map(h =>
        '<button class="dur-btn '+(selHrs===h?'on':'')+'" onclick="selHrs='+h+';renderDur()">'+h+' soat<br><small>'+calcPrice(h).toLocaleString()+' so‘m</small></button>'
      ).join('');
      document.getElementById('m-total').innerText = calcPrice(selHrs).toLocaleString();
    }
    function confirmRent() {
      const pr = calcPrice(selHrs);
      if (botUser && tg && tg.openTelegramLink) {
        tg.openTelegramLink('https://t.me/' + botUser + '?start=rent-' + selAcc.id + '-' + selHrs + '-' + pr);
      } else {
        alert('Botga yozing: /start rent-' + selAcc.id + '-' + selHrs + '-' + pr);
      }
    }

    loadAccs();
  </script>
</body>
</html>
