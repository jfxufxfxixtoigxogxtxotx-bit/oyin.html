<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PUBG 3D Arena</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #090d16; color: #fff; }
    .screen { display: none; width: 100%; height: 100%; position: relative; }
    .screen.active { display: block; }

    .lobby { background: radial-gradient(circle at top, #1e293b, #090d16); padding: 58px 12px 26px; overflow-y: auto; height: 100%; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.08); padding: 10px 12px; border-radius: 12px; margin-bottom: 10px; border-left: 3px solid #facc15; }
    .uc-badge { background: #f59e0b; color: #111; font-weight: 900; padding: 6px 12px; border-radius: 8px; font-size: 13px; }
    .maps-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 10px; }
    .map-btn { padding: 10px 6px; border-radius: 10px; border: 1.5px solid #334155; background: rgba(255,255,255,0.06); color: #fff; font-weight: 700; font-size: 12px; cursor: pointer; }
    .map-btn.on { border-color: #facc15; background: rgba(250,204,21,0.2); color: #fde047; }
    .btn-go { width: 100%; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(180deg, #fde047, #eab308); color: #111; font-size: 16px; font-weight: 900; cursor: pointer; margin-bottom: 12px; }

    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
    .t-btn { flex-shrink: 0; padding: 9px 12px; border-radius: 9px; border: 1px solid #334155; background: #111827; color: #cbd5e1; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; }
    .t-btn.on { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-bottom: 24px; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; font-size: 12px; }
    .card.eq { border-color: #22c55e; background: rgba(34,197,94,0.14); }
    .c-btn { width: 100%; padding: 8px; border: none; border-radius: 7px; font-weight: 800; font-size: 11px; cursor: pointer; background: #f59e0b; color: #111; margin-top: 6px; }
    .c-btn.own { background: #334155; color: #fff; }
    .c-btn.eq { background: #22c55e; color: #052e16; }
    .box { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px; font-size: 13px; margin-bottom: 12px; }
    .inp { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #334155; background: #090d16; color: #fff; margin: 6px 0; }

    #scr-game { background: #1e293b; }
    #c3d { width: 100%; height: 100%; display: block; touch-action: none; }
    .rotate-tip { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.78); padding: 4px 10px; border-radius: 999px; font-size: 11px; z-index: 15; display: none; }
    .hud-tl { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; z-index: 10; flex-wrap: wrap; max-width: 68%; }
    .h-box { background: rgba(0,0,0,0.68); border: 1px solid rgba(255,255,255,0.22); padding: 5px 9px; border-radius: 6px; font-size: 11px; font-weight: 800; }
    .hud-tr { position: absolute; top: 10px; right: 10px; z-index: 10; }
    .minimap { width: 74px; height: 74px; background: rgba(15,23,42,0.82); border: 1.5px solid #cbd5e1; border-radius: 6px; }
    .crosshair { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border: 2px solid rgba(255,255,255,0.85); border-radius: 50%; pointer-events: none; z-index: 9; }

    .joy { position: absolute; bottom: 16px; left: 16px; width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.3); touch-action: none; z-index: 10; }
    .knob { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: rgba(255,255,255,0.85); pointer-events: none; }
    .bot-mid { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; z-index: 10; }
    .hp-bar { width: 120px; height: 10px; background: #1e293b; border: 1px solid #fff; border-radius: 6px; overflow: hidden; }
    .hp-fill { height: 100%; background: #22c55e; width: 100%; }

    .chest-btn { position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%); background: linear-gradient(180deg, #fde047, #d97706); color: #111; border: 2px solid #fff; border-radius: 12px; padding: 10px 18px; font-weight: 900; font-size: 14px; z-index: 16; display: none; cursor: pointer; box-shadow: 0 6px 20px rgba(245,158,11,0.5); }
    .loot-toast { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); background: rgba(17,24,39,0.92); border: 2px solid #facc15; color: #fde047; padding: 8px 16px; border-radius: 12px; font-weight: 800; font-size: 13px; z-index: 20; display: none; text-align: center; }

    .acts { position: absolute; bottom: 14px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 10; }
    .act-r { display: flex; gap: 6px; }
    .ab { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.35); background: rgba(0,0,0,0.68); color: #fff; font-size: 10px; font-weight: 700; cursor: pointer; }
    .ab.on { border-color: #facc15; background: rgba(234,179,8,0.42); }
    .fire { width: 72px; height: 72px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.6); background: radial-gradient(#ef4444,#991b1b); color: #fff; font-weight: 900; font-size: 12px; touch-action: none; }

    .build-panel { position: absolute; bottom: 16px; right: 14px; display: none; flex-direction: column; gap: 6px; z-index: 12; }
    .bp-btn { background: rgba(15,23,42,0.88); border: 1.5px solid #facc15; color: #fde047; padding: 9px 12px; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; }

    .chat-ov { position: absolute; top: 50px; left: 10px; width: 220px; background: rgba(9,13,22,0.75); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 8px; z-index: 12; display: none; font-size: 11px; }
    .chat-list { max-height: 76px; overflow-y: auto; margin-bottom: 6px; }
    .chat-row { display: flex; gap: 4px; }
    .chat-row input { flex: 1; padding: 5px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 11px; }

    .end-ov { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
    .end-ov.open { display: flex; }
    .end-card { background: #1e293b; border: 2px solid #facc15; border-radius: 16px; padding: 18px; text-align: center; max-width: 340px; width: 100%; }
  </style>
</head>
<body>

  <div class="screen lobby active" id="scr-lobby">
    <div class="top-bar">
      <div>
        <div style="font-weight:800;font-size:15px;" id="u-name">O‘yinchi</div>
        <div style="font-size:11px;color:#fde047;">Lvl <span id="u-lvl">1</span> • ☠️ <span id="u-kills">0</span> • 🥇 <span id="u-gold">0</span> Tillo</div>
      </div>
      <div class="uc-badge">💵 <span id="u-uc">0</span> UC</div>
    </div>

    <div class="maps-row">
      <button class="map-btn on" onclick="setMap('erangel',this)">🏝️ Erangel (100)</button>
      <button class="map-btn" onclick="setMap('metro',this)">🚇 Metro Royale</button>
      <button class="map-btn" onclick="setMap('park',this)">🎡 Park (Mahalla)</button>
      <button class="map-btn" onclick="setMap('build',this)">🏠 Uy Qurish</button>
      <button class="map-btn" style="grid-column:span 2;" onclick="setMap('online',this)">🌐 Online Park (Faqat odamlar)</button>
    </div>

    <button class="btn-go" onclick="start3D()">🎮 BOSHLASH (Yotqizib o‘ynang)</button>

    <div class="tabs">
      <button class="t-btn on" onclick="showTab('weapons',this)">🔫 Qurol (100)</button>
      <button class="t-btn" onclick="showTab('armor',this)">🛡️ Bron/Kaska</button>
      <button class="t-btn" onclick="showTab('outfits',this)">👕 Kiyimlar</button>
      <button class="t-btn" onclick="showTab('cars',this)">🚗 Garaj</button>
      <button class="t-btn" onclick="showTab('house',this)">🏢 Uylar</button>
      <button class="t-btn" onclick="showTab('wd',this)">💳 UC Yechish</button>
      <button class="t-btn" onclick="showTab('social',this)">🌐 Online/Do‘st</button>
    </div>

    <div id="tab-content"></div>
  </div>

  <div class="screen" id="scr-game">
    <canvas id="c3d"></canvas>
    <div class="rotate-tip" id="rot-tip">📱 Telefonni yotqizib (gorizontal) o‘ynang!</div>
    <div class="loot-toast" id="loot-toast"></div>
    <div class="hud-tl">
      <button class="h-box" style="background:#dc2626;border:none;color:#fff;" onclick="exit3D()">✖</button>
      <div class="h-box" id="box-alive">Qolgan <span id="g-alive">100</span></div>
      <div class="h-box" id="box-kills">Kill <span id="g-kills">0</span></div>
      <div class="h-box" id="box-gold" style="display:none;color:#fde047;">🥇 <span id="g-gold">0</span></div>
      <div class="h-box" id="g-mode">Erangel</div>
    </div>
    <div class="hud-tr"><canvas class="minimap" id="mmap" width="74" height="74"></canvas></div>
    <div class="crosshair" id="xhair"></div>

    <div class="chat-ov" id="chat-ov">
      <div style="font-weight:700;color:#fde047;margin-bottom:4px;" id="onl-stat">🌐 Online Park (0 bot)</div>
      <div class="chat-list" id="onl-chat"></div>
      <div class="chat-row">
        <input id="onl-inp" placeholder="Xabar yozing..." />
        <button class="h-box" style="background:#22c55e;color:#000;border:none;" onclick="sendOnlChat()">OK</button>
      </div>
    </div>

    <div class="joy" id="joy"><div class="knob" id="knob"></div></div>

    <button class="chest-btn" id="chest-btn" onclick="openNearestChest()">🎁 Sandiqni ochish!</button>

    <div class="bot-mid" id="hp-wrap">
      <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
      <div class="h-box" id="hp-num">100</div>
    </div>

    <div class="acts" id="combat-acts">
      <div class="act-r">
        <button class="ab" id="b-med" onclick="useMed()">🏥<span id="med-cnt">3</span></button>
        <button class="ab" onclick="dropVehicle()">🪂<span>Chaqir</span></button>
        <button class="ab" id="b-car" onclick="toggleVehicle()">🚗<span>Min</span></button>
        <button class="ab" id="b-scope" onclick="toggleScope()">🎯<span>Pritsel</span></button>
      </div>
      <div class="act-r">
        <button class="ab" onclick="doJump()">🦵<span>Sakra</span></button>
        <button class="ab" id="b-crouch" onclick="setStance('crouch')">🙇<span>O‘tir</span></button>
        <button class="ab" id="b-prone" onclick="setStance('prone')">🛌<span>Yot</span></button>
      </div>
      <button class="fire" id="fire-btn">OTISH 🔥</button>
    </div>

    <div class="build-panel" id="build-panel">
      <button class="bp-btn" onclick="upgradeFloor3D()">🏗️ +1 Qavat qurish</button>
      <button class="bp-btn" onclick="nextStyle3D()">🏡 Chiroyli uy almashtirish</button>
      <button class="bp-btn" onclick="dropVehicle()">🪂 Mashina tushirish</button>
      <button class="bp-btn" onclick="toggleVehicle()">🚗 Minish / Tushish</button>
    </div>

    <div class="end-ov" id="end-ov">
      <div class="end-card">
        <h2 id="end-title" style="margin:0 0 8px;"></h2>
        <p id="end-desc" style="font-size:13px;color:#cbd5e1;margin:0 0 14px;"></p>
        <div style="display:flex;gap:8px;">
          <button class="btn-go" style="margin:0;font-size:14px;" onclick="start3D()">🔄 Yangi match</button>
          <button class="btn-go" style="margin:0;font-size:14px;background:#334155;color:#fff;" onclick="exit3D()">🏠 Lobbi</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    let uid = 'u' + Math.floor(Math.random()*99999), uname = 'O‘yinchi';
    try {
      if (tg) {
        tg.ready(); tg.expand();
        if (tg.requestFullscreen) tg.requestFullscreen();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
          uid = 'u' + tg.initDataUnsafe.user.id;
          uname = tg.initDataUnsafe.user.first_name;
        }
      }
    } catch (e) {}
    document.getElementById('u-name').innerText = uname;

    const BASES = ['M416','AKM','AWM','Kar98k','Scar-L','Groza','M762','UMP45','Vector','DP-28'];
    const W_SKINS = [['Muzlik',0x38bdf8],['Oltin',0xfacc15],['Firavn',0xeab308],['Ajdar',0xef4444],['Qonli',0xbe123c],['Kiber',0xa855f7],['Neon',0x22d3ee],['Qora',0x18181b],['Zahar',0x22c55e],['Kumush',0xcbd5e1]];
    const WEAPONS = [];
    for (let i=0; i<10; i++) for (let j=0; j<10; j++) {
      const idx = i*10+j;
      WEAPONS.push({ id:'w'+idx, name:BASES[i]+' '+W_SKINS[j][0], price:idx===0?0:50+(idx%6)*10, dmg:28+(i%4)*14, rate:i===2||i===3?600:125, col:W_SKINS[j][1] });
    }

    const HELMS = [{id:'h0',name:'Oddiy Kaska',price:0,hp:120},{id:'h1',name:'Kaska 1-daraja',price:400,hp:160},{id:'h2',name:'Kaska 2-daraja',price:1200,hp:210},{id:'h3',name:'Kaska 3-daraja',price:2500,hp:280}];
    const VESTS = [{id:'v0',name:'Bronjilet yo‘q',price:0,def:0},{id:'v1',name:'Bronjilet 1-daraja',price:500,def:0.3},{id:'v2',name:'Bronjilet 2-daraja',price:1500,def:0.5},{id:'v3',name:'Bronjilet 3-daraja',price:3000,def:0.7}];
    const OUTFITS = [['Inferno & Qora',0x18181b,0xea580c,0],['Fir‘avn Oltin',0xeab308,0x1d4ed8,1200],['Mumiya Oq',0xf1f5f9,0xe2e8f0,1500],['Ravon',0x0f172a,0x38bdf8,1800],['Joker',0x7c3aed,0x22c55e,2200],['Godzilla',0x1e3a8a,0x06b6d4,2800],['Kiber X-Suit',0x4c1d95,0xf472b6,3500],['Tilla X-Suit',0xd97706,0xfef08a,5000]].map((x,i)=>({id:'s'+i,name:x[0],body:x[1],helm:x[2],price:x[3]}));
    const CARS = [
      {id:'matiz',name:'Matiz',price:50000,col:0x38bdf8,spd:0.42,type:'car'},{id:'tiko',name:'Tiko',price:55000,col:0xef4444,spd:0.40,type:'car'},
      {id:'damas',name:'Damas',price:65000,col:0xf8fafc,spd:0.38,type:'van'},{id:'malibu1',name:'Malibu 1',price:90000,col:0x334155,spd:0.48,type:'car'},
      {id:'gentra',name:'Gentra',price:110000,col:0x1e293b,spd:0.50,type:'car'},{id:'malibu2',name:'Malibu 2 Qopqora',price:150000,col:0x050507,spd:0.56,type:'car'},
      {id:'lambo',name:'Lamborghini',price:180000,col:0xfacc15,spd:0.68,type:'car'},{id:'bugatti',name:'Bugatti',price:200000,col:0x2563eb,spd:0.72,type:'car'},
      {id:'tank',name:'Harbiy Tank',price:190000,col:0x3f6212,spd:0.36,type:'tank'},{id:'heli',name:'Vertolyot',price:200000,col:0x0f172a,spd:0.75,type:'heli'}
    ];
    const HOUSE_STYLES = [{id:'hs0',name:'Oddiy Uy',price:0,col:0x3b82f6,roof:0x78350f},{id:'hs1',name:'Zamonaviy Villa',price:15000,col:0xf8fafc,roof:0x0f172a},{id:'hs2',name:'Oltin Saroy',price:35000,col:0xfef08a,roof:0xb45309},{id:'hs3',name:'Kiber Bino',price:50000,col:0x312e81,roof:0x06b6d4}];

    const TILLOLAR = [
      ['🪙 Tillo Tanga', 300],
      ['💍 Tillo Uzuk', 750],
      ['🥇 Oltin Quyma', 1500],
      ['👑 Tillo Toj', 2500],
      ['🏆 Oltin Kubok', 3500],
      ['💎 Qadimiy Olmos Tillo', 5000]
    ];

    let uc = Number(localStorage.getItem('p3_uc') || localStorage.getItem('br_uc') || localStorage.getItem('pg_uc') || 0);
    let kills = Number(localStorage.getItem('p3_kills') || 0);
    let goldCount = Number(localStorage.getItem('p3_gold') || 0);
    let floors = Number(localStorage.getItem('p3_floors') || 1);
    let ownW = JSON.parse(localStorage.getItem('p3_ow') || '["w0"]'), eqW = localStorage.getItem('p3_ew') || 'w0';
    let ownS = JSON.parse(localStorage.getItem('p3_os') || '["s0"]'), eqS = localStorage.getItem('p3_es') || 's0';
    let ownC = JSON.parse(localStorage.getItem('p3_oc') || '[]'), eqC = localStorage.getItem('p3_ec') || 'malibu2';
    let ownH = JSON.parse(localStorage.getItem('p3_oh') || '["h0"]'), eqH = localStorage.getItem('p3_eh') || 'h0';
    let ownV = JSON.parse(localStorage.getItem('p3_ov') || '["v0"]'), eqV = localStorage.getItem('p3_ev') || 'v0';
    let ownHS = JSON.parse(localStorage.getItem('p3_ohs') || '["hs0"]'), eqHS = localStorage.getItem('p3_ehs') || 'hs0';
    let fbUrl = localStorage.getItem('p3_fb') || '';
    let curMap = 'erangel', curTab = 'weapons';

    function save() {
      localStorage.setItem('p3_uc', uc); localStorage.setItem('p3_kills', kills); localStorage.setItem('p3_gold', goldCount); localStorage.setItem('p3_floors', floors);
      localStorage.setItem('p3_ow', JSON.stringify(ownW)); localStorage.setItem('p3_ew', eqW);
      localStorage.setItem('p3_os', JSON.stringify(ownS)); localStorage.setItem('p3_es', eqS);
      localStorage.setItem('p3_oc', JSON.stringify(ownC)); localStorage.setItem('p3_ec', eqC);
      localStorage.setItem('p3_oh', JSON.stringify(ownH)); localStorage.setItem('p3_eh', eqH);
      localStorage.setItem('p3_ov', JSON.stringify(ownV)); localStorage.setItem('p3_ev', eqV);
      localStorage.setItem('p3_ohs', JSON.stringify(ownHS)); localStorage.setItem('p3_ehs', eqHS);
      document.getElementById('u-uc').innerText = uc.toLocaleString();
      document.getElementById('u-kills').innerText = kills;
      document.getElementById('u-gold').innerText = goldCount;
      document.getElementById('u-lvl').innerText = 1 + Math.floor(kills / 5);
    }

    function setMap(m, btn) { curMap = m; document.querySelectorAll('.map-btn').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }

    function showTab(t, btn) {
      curTab = t;
      if (btn) { document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
      const box = document.getElementById('tab-content');
      if (t==='weapons') box.innerHTML = '<div class="grid">' + WEAPONS.map(w => mkCard(w, ownW, eqW, 'Zarba: '+w.dmg, 'buyItem("w","'+w.id+'")')).join('') + '</div>';
      else if (t==='armor') box.innerHTML = '<div class="grid">' + HELMS.map(x => mkCard(x, ownH, eqH, 'Max HP: '+x.hp, 'buyItem("h","'+x.id+'")')).join('') + VESTS.map(x => mkCard(x, ownV, eqV, 'Himoya: '+Math.round(x.def*100)+'%', 'buyItem("v","'+x.id+'")')).join('') + '</div>';
      else if (t==='outfits') box.innerHTML = '<div class="grid">' + OUTFITS.map(s => mkCard(s, ownS, eqS, 'PUBG Kiyim', 'buyItem("s","'+s.id+'")')).join('') + '</div>';
      else if (t==='cars') box.innerHTML = '<div class="grid">' + CARS.map(c => mkCard(c, ownC, eqC, 'Tezlik: '+Math.round(c.spd*200)+' km/s', 'buyItem("c","'+c.id+'")')).join('') + '</div>';
      else if (t==='house') {
        let h = '<div class="box"><b>🏠 Chiroyli Uylar va Qavatlar (Hozir: '+floors+' qavat):</b></div><div class="grid">' + HOUSE_STYLES.map(s => mkCard(s, ownHS, eqHS, 'Uy dizayni', 'buyItem("hs","'+s.id+'")')).join('');
        for (let f=1; f<=8; f++) {
          const pr = f*10000, done = floors>=f;
          h += '<div class="card '+(done?'eq':'')+'"><b>🏢 '+f+'-qavat</b><div>'+pr.toLocaleString()+' UC</div><button class="c-btn '+(done?'eq':'')+'" onclick="buyFloor('+f+','+pr+')">'+(done?'✅ Qurilgan':'Qurish')+'</button></div>';
        }
        box.innerHTML = h + '</div>';
      } else if (t==='wd') {
        box.innerHTML = '<div class="box"><b>💳 UC Yechib olish (Ariza):</b><input class="inp" type="number" id="wd-id" placeholder="PUBG Mobile ID raqamingiz" />' +
          '<button class="c-btn" onclick="askWd(60000,60)">60,000 UC ➔ 60 UC ariza</button>' +
          '<button class="c-btn" onclick="askWd(360000,360)">360,000 UC ➔ 360 UC ariza</button>' +
          '<button class="c-btn" onclick="askWd(720000,720)">720,000 UC ➔ 720 UC ariza</button>' +
          '<div id="wd-res" style="margin-top:8px;color:#86efac;"></div></div>';
      } else {

      const g = new THREE.Group();

      const l2 = new THREE.Mesh(gLeg, new THREE.MeshLambertMaterial({color:0x111827})); l2.position.set(0.22,0.5,0);
      const body = new THREE.Mesh(gBody, new THREE.MeshLambertMaterial({color:bodyCol})); body.position.set(0,1.35,0);
      const head = new THREE.Mesh(gHead, new THREE.MeshLambertMaterial({color:helmCol})); head.position.set(0,2.08,0);
      const spike = new THREE.Mesh(gSpike, new THREE.MeshLambertMaterial({color:0xfacc15})); spike.position.set(0,2.45,0);
      g.add(l1, l2, body, head, spike);
      if (showGun) {
        const bg = new THREE.Mesh(gGun, new THREE.MeshLambertMaterial({color:gunCol})); bg.position.set(-0.15,1.45,0.35); bg.rotation.z=0.5;
        const hg = new THREE.Mesh(gGun, new THREE.MeshLambertMaterial({color:gunCol})); hg.position.set(0.35,1.35,-0.5); hg.rotation.x=Math.PI/2;

        g.add(box, win);

      g.add(roof); g.position.set(x,0,z); scene.add(g); return g;

        fetch(fbUrl+'/players/'+uid+'.json', {method:'PUT', body:JSON.stringify({n:uname,x:pGroup.position.x,z:pGroup.position.z,y:yaw,t:Date.now()})});
        const r = await fetch(fbUrl+'/players.json'), d = await r.json()||{}, now = Date.now();
        Object.keys(d).forEach(k => {
          if (k===uid || now-d[k].t>12000) return;
          if (!remotePlayers[k]) { remotePlayers[k]=buildChar(0x38bdf8,0xfacc15,0,false); scene.add(remotePlayers[k]); }
          remotePlayers[k].position.set(d[k].x,0,d[k].z); remotePlayers[k].rotation.y=d[k].y;
        });
        const cr = await fetch(fbUrl+'/chat.json'), cd = await cr.json()||{};
        const msgs = Object.values(cd).slice(-6).map(m=>'<div><b>'+m.n+':</b> '+m.m+'</div>').join('');
        if (msgs) document.getElementById('onl-chat').innerHTML = msgs;

      if (hitCd > 0) hitCd--;

      const cData = CARS.find(x=>x.id===eqC)||CARS[0], vs = VESTS.find(x=>x.id===eqV)||VESTS[0];
      const spd = inVeh ? cData.spd : (stance==='prone'?0.12:(stance==='crouch'?0.20:0.32));
      const fwd = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)), rgt = new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
      pGroup.position.addScaledVector(fwd, -joyV.y*spd).addScaledVector(rgt, joyV.x*spd);
      pGroup.position.x = Math.max(-165,Math.min(165,pGroup.position.x)); pGroup.position.z = Math.max(-165,Math.min(165,pGroup.position.z));
      pGroup.rotation.y = yaw;

      if (!onGround) { pGroup.position.y+=vy; vy-=0.012; if (pGroup.position.y<=0) { pGroup.position.y=0; vy=0; onGround=true; } }
      pGroup.scale.y = stance==='crouch'?0.68:1; pGroup.rotation.x = stance==='prone'?Math.PI/2:0;

      if (carGroup) {
        if (carDropping) { carGroup.position.y-=0.25; if (carGroup.position.y<=0) { carGroup.position.y=0; carDropping=false; carGroup.remove(chuteMesh); } }
        else if (inVeh) { carGroup.position.copy(pGroup.position); if (cData.type==='heli') carGroup.position.y=4.5; carGroup.rotation.y=yaw; }
      }
      if (carouselGroup) carouselGroup.rotation.y += 0.02;
      for (const k of kids) { k.mesh.position.x+=Math.cos(k.ang)*0.04; k.mesh.position.z+=Math.sin(k.ang)*0.04; if (Math.random()<0.02) k.ang+=1; k.mesh.rotation.y=-k.ang; }

      /* Metro Sandiqlar tekshiruvi */
      if (curMap === 'metro') {
        nearChest = null;
        for (const ch of chests) {
          if (ch.open) continue;
          ch.gem.rotation.y += 0.05;
          if (pGroup.position.distanceTo(ch.mesh.position) < 5.5) nearChest = ch;
        }
        document.getElementById('chest-btn').style.display = nearChest ? 'block' : 'none';
      }

      if (curMap==='online' && Date.now()-lastSync>1200) { lastSync=Date.now(); syncOnline(); }
      if (firing) fire3D();

      /* Botlar (sekin va adolatli otish) */
      for (let i=bots.length-1; i>=0; i--) {
        const b = bots[i]; let tgt = pGroup, md = b.mesh.position.distanceTo(pGroup.position);
        if (i%3!==0 && bots.length>1) { const o = bots[(i+1)%bots.length], od = b.mesh.position.distanceTo(o.mesh.position); if (od<md) { tgt=o.mesh; md=od; } }
        b.mesh.lookAt(tgt.position.x,0,tgt.position.z);
        if (md>12 && md<75) b.mesh.position.addScaledVector(new THREE.Vector3().subVectors(tgt.position,b.mesh.position).normalize(), 0.09);
        if (--b.cd<=0 && md<36) {
          b.cd = 160 + Math.random()*140;
          if (tgt===pGroup) {
            if (!inVeh && hitCd === 0) {
              hitCd = 45;
              const rawDmg = 1 + Math.floor(Math.random()*2);
              const finalDmg = Math.max(1, Math.round(rawDmg * (1 - vs.def)));
              pHP -= finalDmg; updHUD();
              if (pHP<=0) { running3D=false; document.getElementById('end-title').innerText='💥 Mag‘lub bo‘ldingiz!'; document.getElementById('end-desc').innerText='Kill: '+matchKills; document.getElementById('end-ov').classList.add('open'); }
            }
          } else {
            const oi=(i+1)%bots.length; bots[oi].hp-=30;
            if (bots[oi].hp<=0) { scene.remove(bots[oi].mesh); bots.splice(oi,1); updHUD(); }
          }
        }
      }

      for (let i=bullets.length-1; i>=0; i--) {
        const b=bullets[i]; b.mesh.position.add(b.vel); b.life--; let hit=false;
        for (let j=bots.length-1; j>=0; j--) {
          if (b.mesh.position.distanceTo(bots[j].mesh.position.clone().add(new THREE.Vector3(0,1.4,0))) < 1.8) {
            bots[j].hp -= b.dmg; hit=true;
            if (bots[j].hp<=0) {
              scene.remove(bots[j].mesh); bots.splice(j,1);
              matchKills++; kills++; uc += 100; save(); updHUD();
              if (bots.length===0 && curMap==='erangel') winMatch();
            }
            break;
          }
        }
        if (hit || b.life<=0) { scene.remove(b.mesh); bullets.splice(i,1); }
      }

      const dist=scoped?2.2:(inVeh?9.5:5.2), camH=stance==='prone'?1.4:(stance==='crouch'?2.2:(inVeh?4.2:2.9));
      cam.position.set(pGroup.position.x+Math.sin(yaw)*dist, pGroup.position.y+camH-Math.sin(pitch)*2, pGroup.position.z+Math.cos(yaw)*dist);
      cam.lookAt(pGroup.position.x-Math.sin(yaw)*8, pGroup.position.y+1.6+Math.sin(pitch)*6, pGroup.position.z-Math.cos(yaw)*8);

      const mc=document.getElementById('mmap').getContext('2d'); mc.fillStyle='#0f172a'; mc.fillRect(0,0,74,74);
      mc.fillStyle='#38bdf8'; mc.fillRect(37+pGroup.position.x*0.2, 37+pGroup.position.z*0.2, 4, 4);
      mc.fillStyle='#facc15'; for (const ch of chests) if (!ch.open) mc.fillRect(37+ch.mesh.position.x*0.2, 37+ch.mesh.position.z*0.2, 3, 3);
      mc.fillStyle='#ef4444'; for (const b of bots) mc.fillRect(37+b.mesh.position.x*0.2, 37+b.mesh.position.z*0.2, 2, 2);
      ren.render(scene, cam);
    }

    window.addEventListener('resize', () => {
      if (ren && cam && running3D) {
        ren.setSize(window.innerWidth, window.innerHeight); cam.aspect=window.innerWidth/window.innerHeight; cam.updateProjectionMatrix();
        document.getElementById('rot-tip').style.display = window.innerHeight > window.innerWidth ? 'block' : 'none';
      }
    });

    const jz=document.getElementById('joy'), kb=document.getElementById('knob');
    jz.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0],r=jz.getBoundingClientRect();let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);const mr=r.width/2-15,d=Math.hypot(dx,dy);if(d>mr){dx=dx/d*mr;dy=dy/d*mr;}kb.style.transform='translate('+dx+'px,'+dy+'px)';joyV.x=dx/mr;joyV.y=dy/mr;},{passive:false});
    jz.addEventListener('touchend',()=>{joyV={x:0,y:0};kb.style.transform='translate(0,0)';});
    let lx=null,ly=null; const c3=document.getElementById('c3d');
    c3.addEventListener('touchstart',e=>{lx=e.touches[0].clientX;ly=e.touches[0].clientY;});
    c3.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];yaw-=(t.clientX-lx)*0.006;pitch=Math.max(-0.5,Math.min(0.4,pitch-(t.clientY-ly)*0.004));lx=t.clientX;ly=t.clientY;},{passive:false});
    const fb=document.getElementById('fire-btn');
    fb.addEventListener('touchstart',e=>{e.preventDefault();firing=true;fire3D();},{passive:false});
    fb.addEventListener('touchend',()=>firing=false);
  </script>
</body>
  </html>
