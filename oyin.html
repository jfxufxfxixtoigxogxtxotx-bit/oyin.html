<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PUBG Arena</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100vw; height: 100dvh; overflow: hidden; font-family: sans-serif; background: #0b101b; color: #fff; }
    .screen { display: none; width: 100%; height: 100%; position: relative; }
    .screen.active { display: block; }
    canvas { display: block; width: 100%; height: 100%; }

    .lb-top { position: absolute; top: 50px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 5; }
    .lb-prof { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: rgba(12,18,30,0.78); border: 1px solid rgba(255,255,255,0.2); border-left: 3px solid #facc15; padding: 6px 12px 6px 8px; border-radius: 8px; }
    .lb-right { pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .uc-pill { background: rgba(12,18,30,0.85); border: 1px solid #f59e0b; color: #fde047; padding: 5px 12px; border-radius: 8px; font-weight: 800; font-size: 13px; }
    .sq-btn { background: rgba(12,18,30,0.8); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }

    .lb-bot { position: absolute; left: 10px; right: 10px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; z-index: 5; }
    .lb-start-row { display: flex; align-items: flex-end; justify-content: space-between; pointer-events: auto; }
    .mode-tag { background: rgba(12,18,30,0.8); border: 1px solid rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 6px; font-size: 11px; color: #e2e8f0; margin-bottom: 4px; width: fit-content; }
    .btn-pubg { background: linear-gradient(180deg, #fde047, #eab308); color: #111827; border: 2px solid #fef08a; border-radius: 6px; padding: 13px 30px; font-size: 18px; font-weight: 900; cursor: pointer; }
    .lb-nav { pointer-events: auto; display: flex; gap: 4px; background: rgba(12,18,30,0.86); border-top: 1px solid rgba(255,255,255,0.2); padding: 6px; border-radius: 10px; }
    .nav-item { flex: 1; padding: 7px 2px; border: none; border-radius: 7px; background: transparent; color: #e2e8f0; font-size: 11px; font-weight: 700; cursor: pointer; }

    .drawer-bg { position: absolute; inset: 0; background: rgba(6,10,18,0.78); display: none; align-items: flex-end; z-index: 25; }
    .drawer-bg.open { display: flex; }
    .drawer { width: 100%; max-height: 75dvh; background: #111827; border-top: 2px solid #f59e0b; border-radius: 18px 18px 0 0; padding: 14px; display: flex; flex-direction: column; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .drawer-body { overflow-y: auto; flex: 1; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .card { background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; }
    .card.eq { border-color: #22c55e; background: rgba(34,197,94,0.12); }
    .c-btn { width: 100%; padding: 8px; border-radius: 8px; border: none; font-weight: 800; font-size: 12px; cursor: pointer; background: #f59e0b; color: #111; }
    .c-btn.own { background: #334155; color: #fff; }
    .c-btn.eq { background: #22c55e; color: #052e16; }
    .list-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 9px 12px; margin-bottom: 7px; font-size: 13px; cursor: pointer; }
    .wd-inp { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid #334155; background: #0b101b; color: #fff; margin: 6px 0 10px; font-size: 14px; }

    #scr-game { background: #2c4728; }
    #game-canvas { touch-action: none; }
    .hud-top { position: absolute; top: 52px; left: 10px; right: 100px; display: flex; flex-wrap: wrap; gap: 5px; pointer-events: none; z-index: 10; }
    .hud-pill { background: rgba(9,13,22,0.82); border: 1px solid rgba(255,255,255,0.2); padding: 5px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; pointer-events: auto; }
    .exit-btn { background: #dc2626; color: #fff; border: none; cursor: pointer; }
    .joy-zone { position: absolute; bottom: 20px; left: 18px; width: 114px; height: 114px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.28); touch-action: none; z-index: 10; }
    .joy-knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,0.82); pointer-events: none; }
    .act-pad { position: absolute; bottom: 18px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; z-index: 10; }
    .act-row { display: flex; gap: 6px; }
    .act-btn { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3); background: rgba(15,23,42,0.82); color: #fff; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
    .act-btn.on { border-color: #fbbf24; background: rgba(245,158,11,0.38); }
    .fire-btn { width: 82px; height: 82px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.55); background: radial-gradient(circle,#ef4444,#991b1b); color: #fff; font-weight: 800; font-size: 14px; touch-action: none; }
    .go-overlay { position: absolute; inset: 0; background: rgba(9,13,22,0.88); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 30; }
    .go-overlay.open { display: flex; }
    .go-card { width: 100%; max-width: 320px; background: #1e293b; border-radius: 18px; padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="screen active" id="scr-lobby">
    <canvas id="lobby-canvas"></canvas>
    <div class="lb-top">
      <div class="lb-prof">
        <div style="font-size:22px;">🎖️</div>
        <div>
          <div style="font-weight:800;font-size:13px;" id="p-name">O‘yinchi</div>
          <div style="font-size:11px;color:#fde047;">☠️ <span id="p-kills">0</span> Kill • VIP</div>
        </div>
      </div>
      <div class="lb-right">
        <div class="uc-pill">💵 <span id="uc-bal">0</span> UC</div>
        <div style="display:flex;gap:6px;">
          <button class="sq-btn" onclick="openDrawer('shop')">🛒 Do‘kon</button>
          <button class="sq-btn" onclick="openDrawer('top')">🏆 Top 100</button>
        </div>
      </div>
    </div>
    <div class="lb-bot">
      <div class="lb-start-row">
        <div>
          <div class="mode-tag">🗺️ Erangel Arena</div>
          <button class="btn-pubg" onclick="startGame(null)">BOSHLASH</button>
        </div>
        <div class="mode-tag" id="lb-eq-info">🔫 Oddiy • 🐼 Panda</div>
      </div>
      <div class="lb-nav">
        <button class="nav-item" onclick="openDrawer('shop')">🔫 Qurol</button>
        <button class="nav-item" onclick="openDrawer('skins')">👕 Skin</button>
        <button class="nav-item" onclick="openDrawer('garage')">🚗 Garaj</button>
        <button class="nav-item" onclick="openDrawer('arena')">⚔️ Raqib</button>
        <button class="nav-item" onclick="openDrawer('wd')">💳 UC</button>
      </div>
    </div>
    <div class="drawer-bg" id="drawer-bg" onclick="if(event.target===this)closeDrawer()">
      <div class="drawer">
        <div class="drawer-head">
          <div style="font-weight:800;font-size:16px;" id="drawer-title">Do‘kon</div>
          <button class="sq-btn" onclick="closeDrawer()">✕ Yopish</button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
      </div>
    </div>
  </div>

  <div class="screen" id="scr-game">
    <canvas id="game-canvas"></canvas>
    <div class="hud-top">
      <button class="hud-pill exit-btn" onclick="exitGame()">✖ Chiqish</button>
      <div class="hud-pill">❤️ <span id="h-hp">100</span></div>
      <div class="hud-pill">💵 <span id="h-uc">0</span></div>
      <div class="hud-pill">☠️ <span id="h-kills">0</span></div>
      <div class="hud-pill" id="h-mode">Arena</div>
    </div>
    <div class="joy-zone" id="joy-zone"><div class="joy-knob" id="joy-knob"></div></div>
    <div class="act-pad">
      <div class="act-row">
        <button class="act-btn" id="btn-car" onclick="toggleCar()">🚗<span>Mashina</span></button>
        <button class="act-btn" id="btn-scope" onclick="toggleScope()">🎯<span>Pritsel</span></button>
      </div>
      <div class="act-row">
        <button class="act-btn" onclick="doJump()">🦵<span>Sakrash</span></button>
        <button class="act-btn" id="btn-crouch" onclick="setStance('crouch')">🙇<span>O‘tir</span></button>
        <button class="act-btn" id="btn-prone" onclick="setStance('prone')">🛌<span>Yot</span></button>
      </div>
      <button class="fire-btn" id="fire-btn">OTISH 🔥</button>
    </div>
    <div class="go-overlay" id="go-modal">
      <div class="go-card">
        <h2 style="margin:0 0 8px;">💥 Mag‘lub bo‘ldingiz!</h2>
        <p style="font-size:14px;color:#cbd5e1;" id="go-txt"></p>
        <button class="btn-pubg" style="width:100%;margin-bottom:8px;font-size:15px;" onclick="startGame(duelEnemy)">🔄 Qayta o‘ynash</button>
        <button class="sq-btn" style="width:100%;padding:12px;" onclick="exitGame()">🏠 Lobbiga qaytish</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    let playerName = 'O‘yinchi';
    try {
      if (tg) {
        tg.ready(); tg.expand();
        if (tg.requestFullscreen) tg.requestFullscreen();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) playerName = tg.initDataUnsafe.user.first_name;
      }
    } catch (e) {}
    document.getElementById('p-name').innerText = playerName;

    const WEAPONS = {
      starter:   { id:'starter',   icon:'🔫', name:'Boshlang‘ich',  desc:'Oddiy', price:0, dmg:35, rate:380, spd:12, rng:280, col:'#fde047', len:14 },
      karambit:  { id:'karambit',  icon:'🌙', name:'Kerambit',      desc:'Kamalak pichoq', price:35, dmg:110, rate:260, spd:12, rng:115, col:'#2dd4bf', melee:true, len:16 },
      butterfly: { id:'butterfly', icon:'🦋', name:'Babochka',      desc:'Neon pichoq', price:35, dmg:105, rate:240, spd:12, rng:115, col:'#e879f9', melee:true, len:16 },
      knife:     { id:'knife',     icon:'🔪', name:'Pichoq',        desc:'Qizil taktik', price:35, dmg:100, rate:280, spd:12, rng:110, col:'#fb7185', melee:true, len:15 },
      pistol:    { id:'pistol',    icon:'🟡', name:'To‘pponcha',    desc:'Oltin rang', price:35, dmg:55, rate:280, spd:15, rng:440, col:'#facc15', len:16 },
      rifle:     { id:'rifle',     icon:'💠', name:'Avtomat AKM',   desc:'Neon-muz rang', price:35, dmg:36, rate:105, spd:17, rng:540, col:'#38bdf8', len:24 },
      sniper:    { id:'sniper',    icon:'🔴', name:'Snayper AWM',   desc:'Ajdar qizil', price:35, dmg:135, rate:680, spd:25, rng:820, col:'#f87171', len:30 }
    };
    const SKINS = {
      soldier: { id:'soldier', icon:'🥋', name:'Komando',       price:0,   body:'#f1f5f9', pants:'#1e293b', head:'#334155', accent:'#94a3b8' },
      pharaoh: { id:'pharaoh', icon:'👑', name:'Fir‘avn',       price:150, body:'#eab308', pants:'#1d4ed8', head:'#1d4ed8', accent:'#fef08a' },
      mummy:   { id:'mummy',   icon:'🧻', name:'Mumiya',        price:150, body:'#e2e8f0', pants:'#cbd5e1', head:'#f8fafc', accent:'#22d3ee' },
      inferno: { id:'inferno', icon:'👹', name:'Inferno Kaska', price:150, body:'#18181b', pants:'#27272a', head:'#ea580c', accent:'#fde047' },
      cyber:   { id:'cyber',   icon:'🤖', name:'Kiber',         price:150, body:'#7c3aed', pants:'#312e81', head:'#06b6d4', accent:'#f472b6' }
    };
    const CARS = {
      none:    { id:'none',    icon:'🚗', name:'Standart Qizil', price:0,      col:'#dc2626', col2:'#1e293b', spd:0 },
      lambo:   { id:'lambo',   icon:'🏎️', name:'Lamborghini',    price:200000, col:'#facc15', col2:'#111827', spd:8.8 },
      bugatti: { id:'bugatti', icon:'🚙', name:'Bugatti',        price:200000, col:'#2563eb', col2:'#0f172a', spd:9.2 },
      malibu2: { id:'malibu2', icon:'🚘', name:'Malibu 2',       price:200000, col:'#f8fafc', col2:'#1e293b', spd:8.0 }
    };

    let uc = Number(localStorage.getItem('br_uc') || localStorage.getItem('pg_uc') || 0);
    let totalKills = Number(localStorage.getItem('br_kills') || 0);
    let ownW = JSON.parse(localStorage.getItem('br_ow') || '["starter"]');
    let eqW = localStorage.getItem('br_ew') || 'starter';
    let ownS = JSON.parse(localStorage.getItem('br_os') || '["soldier"]');
    let eqS = localStorage.getItem('br_es') || 'soldier';
    let ownC = JSON.parse(localStorage.getItem('br_oc') || '["none"]');
    let eqC = localStorage.getItem('br_ec') || 'none';
    let activeTab = 'shop';

    function saveAll() {
      localStorage.setItem('br_uc', uc); localStorage.setItem('br_kills', totalKills);
      localStorage.setItem('br_ow', JSON.stringify(ownW)); localStorage.setItem('br_ew', eqW);
      localStorage.setItem('br_os', JSON.stringify(ownS)); localStorage.setItem('br_es', eqS);
      localStorage.setItem('br_oc', JSON.stringify(ownC)); localStorage.setItem('br_ec', eqC);
      document.getElementById('uc-bal').innerText = uc.toLocaleString();
      document.getElementById('h-uc').innerText = uc.toLocaleString();
      document.getElementById('p-kills').innerText = totalKills;
      document.getElementById('lb-eq-info').innerText = WEAPONS[eqW].icon + ' ' + WEAPONS[eqW].name + ' • 🐼 Panda';
    }

    const ARENA_BOTS = Array.from({ length: 99 }, (_, i) => {
      const n = ['Sardor_Pro','Azizbek_UZ','Shohruh_99','Jasur_PUBG','Bekzod_AWM','Mirjalol','Doston_X','Samandar','Ulugbek_VIP','Timur_King'];
      return {
        name: n[i%n.length] + '_' + (10+i), kills: Math.max(2, 320-i*3), uc: Math.max(200, (320-i*3)*100),
        skin: ['pharaoh','mummy','inferno','cyber','soldier'][i%5],
        weapon: ['sniper','rifle','karambit','butterfly','pistol'][i%5]
      };
    });

    function openDrawer(tab) { activeTab = tab; document.getElementById('drawer-bg').classList.add('open'); renderDrawer(); }
    function closeDrawer() { document.getElementById('drawer-bg').classList.remove('open'); }
    function gridHtml(dict, ownArr, eqId, type) {
      return '<div class="grid-2">' + Object.values(dict).filter(x => x.price > 0).map(x => {
        const isO = ownArr.includes(x.id), isE = eqId === x.id;
        return '<div class="card ' + (isE?'eq':'') + '"><div><div style="font-size:26px;">' + x.icon + '</div>' +
          '<div style="font-weight:700;font-size:14px;">' + x.name + '</div>' +
          '<div style="font-size:11px;color:#94a3b8;margin-bottom:8px;">' + (x.desc||'Maxsus') + '</div></div>' +
          '<button class="c-btn ' + (isE?'eq':(isO?'own':'')) + '" onclick="buyItem(\'' + type + '\',\'' + x.id + '\')">' +
          (isE?'✅ Tanlangan':(isO?'Tanlash':'💵 '+x.price.toLocaleString()+' UC')) + '</button></div>';
      }).join('') + '</div>';
    }
    function renderDrawer() {
      const t = { shop:'🔫 Qurollar (35 UC)', skins:'👕 Skinlar', garage:'🚗 Garaj (200,000 UC)', arena:'⚔️ Raqiblar', top:'🏆 Top 100', wd:'💳 PUBG ID ga UC' };
      document.getElementById('drawer-title').innerText = t[activeTab];
      const b = document.getElementById('drawer-body');
      if (activeTab==='shop') b.innerHTML = gridHtml(WEAPONS, ownW, eqW, 'w');
      else if (activeTab==='skins') b.innerHTML = gridHtml(SKINS, ownS, eqS, 's');
      else if (activeTab==='garage') b.innerHTML = gridHtml(CARS, ownC, eqC, 'c');
      else if (activeTab==='arena') {
        b.innerHTML = ARENA_BOTS.slice(0,25).map((x,i) =>
          '<div class="list-row" onclick="closeDrawer();startGame(' + i + ')"><div><b>🟢 ' + x.name + '</b>' +
          '<div style="font-size:11px;color:#94a3b8;">' + SKINS[x.skin].name + ' • ' + WEAPONS[x.weapon].name + '</div></div>' +
          '<span style="background:#ef4444;padding:5px 10px;border-radius:8px;font-weight:700;font-size:11px;">⚔️ Urush</span></div>'
        ).join('');
      } else if (activeTab==='top') {
        const all = [...ARENA_BOTS, { name: playerName+' (Siz)', kills: totalKills, uc: uc, me: true }].sort((a,b)=>b.uc-a.uc).slice(0,100);
        b.innerHTML = all.map((p,i) =>
          '<div class="list-row" style="' + (p.me?'border:1px solid #22c55e;background:rgba(34,197,94,0.16);':'') + '">' +
          '<b>#' + (i+1) + ' ' + p.name + '</b><span>☠️ ' + p.kills + ' | 💵 <b>' + p.uc.toLocaleString() + '</b></span></div>'
        ).join('');
      } else {
        b.innerHTML = '<div style="font-size:12px;color:#94a3b8;margin-bottom:8px;">O‘yindagi UC — virtual valyuta. Admin sovrin yuborishi uchun PUBG ID yozing:</div>' +
          '<input class="wd-inp" type="number" id="pubg-id" placeholder="PUBG ID" />' +
          '<input class="wd-inp" type="number" id="wd-amt" placeholder="Miqdor (kamida 100)" />' +
          '<button class="btn-pubg" style="width:100%;font-size:15px;" onclick="sendWd()">📩 So‘rov yuborish</button><div id="wd-msg" style="margin-top:8px;font-size:12px;color:#86efac;"></div>';
      }
    }
    function buyItem(type, id) {
      const dict = type==='w'?WEAPONS:(type==='s'?SKINS:CARS), own = type==='w'?ownW:(type==='s'?ownS:ownC), item = dict[id];
      if (!own.includes(id)) {
        if (uc < item.price) { alert('❌ UC yetarli emas! Kerak: ' + item.price.toLocaleString() + ' UC'); return; }
        uc -= item.price; own.push(id);
      }
      if (type==='w') eqW=id; if (type==='s') eqS=id; if (type==='c') eqC=id;
      saveAll(); renderDrawer();
    }
    function sendWd() {
      const pid = document.getElementById('pubg-id').value.trim(), amt = Number(document.getElementById('wd-amt').value.trim());
      if (pid.length < 5 || amt < 100 || amt > uc) { alert('ID va miqdorni to‘g‘ri kiriting!'); return; }
      uc -= amt; saveAll(); document.getElementById('wd-msg').innerText = '✅ So‘rov saqlandi! ID: ' + pid + ' | ' + amt + ' UC';
    }

    /* Lobby Scene */
    const lC = document.getElementById('lobby-canvas'), lX = lC.getContext('2d');
    let inBattle = false, lbT = 0;
    function drawLobby() {
      if (!inBattle) {
        if (lC.width !== window.innerWidth || lC.height !== window.innerHeight) { lC.width = window.innerWidth; lC.height = window.innerHeight; }
        const W = lC.width, H = lC.height, hor = H * 0.56; lbT += 0.04;
        const sky = lX.createLinearGradient(0,0,0,hor);
        sky.addColorStop(0,'#2a1b4e'); sky.addColorStop(0.55,'#8b4c70'); sky.addColorStop(1,'#f4a261');
        lX.fillStyle = sky; lX.fillRect(0,0,W,H);

        lX.fillStyle = '#475569'; lX.beginPath(); lX.moveTo(0,hor);
        lX.lineTo(W*0.18,hor-85); lX.lineTo(W*0.4,hor-28); lX.lineTo(W*0.65,hor-105); lX.lineTo(W,hor-65); lX.lineTo(W,hor); lX.fill();
        lX.fillStyle = '#e2e8f0'; lX.beginPath(); lX.moveTo(W*0.65,hor-105); lX.lineTo(W*0.58,hor-70); lX.lineTo(W*0.71,hor-72); lX.fill();

        const grd = lX.createLinearGradient(0,hor,0,H);
        grd.addColorStop(0,'#64748b'); grd.addColorStop(0.28,'#2b211b'); grd.addColorStop(1,'#14110f');
        lX.fillStyle = grd; lX.fillRect(0,hor,W,H-hor);

        /* House */
        const hx = W*0.07, hy = hor-38;
        lX.fillStyle = '#452414'; lX.fillRect(hx,hy,92,50);
        lX.fillStyle = '#29150b'; lX.beginPath(); lX.moveTo(hx-8,hy); lX.lineTo(hx+46,hy-32); lX.lineTo(hx+100,hy); lX.fill();
        lX.fillStyle = '#facc15'; lX.fillRect(hx+16,hy+14,15,15); lX.fillRect(hx+60,hy+14,15,15);

        /* Car */
        const car = CARS[eqC]||CARS.none, cx = W*0.18, cy = hor+42;
        lX.fillStyle = 'rgba(0,0,0,0.45)'; lX.beginPath(); lX.ellipse(cx,cy+15,62,11,0,0,Math.PI*2); lX.fill();
        lX.fillStyle = car.col; lX.fillRect(cx-55,cy-10,110,24);
        lX.fillStyle = car.col2; lX.beginPath(); lX.moveTo(cx-32,cy-10); lX.lineTo(cx-12,cy-25); lX.lineTo(cx+24,cy-25); lX.lineTo(cx+38,cy-10); lX.fill();
        lX.fillStyle = '#111'; lX.beginPath(); lX.arc(cx-30,cy+14,10,0,Math.PI*2); lX.arc(cx+30,cy+14,10,0,Math.PI*2); lX.fill();
        lX.fillStyle = '#fef08a'; lX.fillRect(cx+50,cy-4,5,7);

        /* Hero */
        const px = W*0.5, py = hor+60, br = Math.sin(lbT)*2.5, sk = SKINS[eqS]||SKINS.soldier, wp = WEAPONS[eqW]||WEAPONS.starter;
        lX.fillStyle = 'rgba(0,0,0,0.5)'; lX.beginPath(); lX.ellipse(px,py+52,26,8,0,0,Math.PI*2); lX.fill();
        lX.fillStyle = sk.pants; lX.fillRect(px-14,py+10,11,40); lX.fillRect(px+3,py+10,11,40);
        lX.fillStyle = sk.body; lX.fillRect(px-19,py-34+br,38,46);
        lX.fillRect(px-28,py-30+br,9,32); lX.fillRect(px+19,py-30+br,9,32);
        lX.fillStyle = wp.col; lX.fillRect(px+21,py-6+br,7,wp.len+6);
        lX.fillStyle = '#f1c27d'; lX.beginPath(); lX.arc(px,py-48+br,13,0,Math.PI*2); lX.fill();
        lX.fillStyle = sk.head; lX.beginPath(); lX.arc(px,py-52+br,13,Math.PI,0); lX.fill();
        if (eqS==='inferno') { lX.fillStyle='#fbbf24'; lX.beginPath(); lX.moveTo(px-9,py-60+br); lX.lineTo(px-16,py-75+br); lX.lineTo(px-3,py-62+br); lX.fill(); lX.beginPath(); lX.moveTo(px+9,py-60+br); lX.lineTo(px+16,py-75+br); lX.lineTo(px+3,py-62+br); lX.fill(); }
        else if (eqS==='pharaoh') { lX.fillStyle='#fde047'; lX.fillRect(px-12,py-63+br,24,6); }
        else if (eqS==='mummy') { lX.fillStyle='#22d3ee'; lX.fillRect(px-5,py-50+br,4,3); lX.fillRect(px+2,py-50+br,4,3); }

        /* Panda */
        const ax = W*0.73, ay = hor+84;
        lX.fillStyle = 'rgba(0,0,0,0.45)'; lX.beginPath(); lX.ellipse(ax,ay+24,22,7,0,0,Math.PI*2); lX.fill();
        lX.fillStyle = '#f8fafc'; lX.beginPath(); lX.ellipse(ax,ay+5,17,19,0,0,Math.PI*2); lX.fill();
        lX.fillStyle = '#18181b'; lX.beginPath(); lX.arc(ax-14,ay+15,6,0,Math.PI*2); lX.arc(ax+14,ay+15,6,0,Math.PI*2); lX.fill();
        lX.fillStyle = '#f8fafc'; lX.beginPath(); lX.arc(ax,ay-17+br*0.5,14,0,Math.PI*2); lX.fill();
        lX.fillStyle = '#18181b'; lX.beginPath(); lX.arc(ax-11,ay-28+br*0.5,5,0,Math.PI*2); lX.arc(ax+11,ay-28+br*0.5,5,0,Math.PI*2); lX.fill();
        lX.beginPath(); lX.arc(ax-5,ay-18+br*0.5,3.5,0,Math.PI*2); lX.arc(ax+5,ay-18+br*0.5,3.5,0,Math.PI*2); lX.fill();
      }
      requestAnimationFrame(drawLobby);
    }

    saveAll(); drawLobby();

    /* Battle Arena */
    const canvas = document.getElementById('game-canvas'), ctx = canvas.getContext('2d'), WORLD = 2000;
    let running = false, animId = null, duelEnemy = null, player, enemies, bullets, floats, houses, trees;
    let joyVec = {x:0,y:0}, firing = false, lastShot = 0, sessionKills = 0, slashT = 0;
    let scopeOn = false, stance = 'stand', jumpZ = 0, jumpV = 0, inCar = false;

    function startGame(botIdx) {
      inBattle = true; duelEnemy = botIdx;
      document.getElementById('scr-lobby').classList.remove('active');
      document.getElementById('scr-game').classList.add('active');
      document.getElementById('go-modal').classList.remove('open');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      player = { x:WORLD/2, y:WORLD/2, r:17, hp:100, angle:0, walk:0 };
      enemies = []; bullets = []; floats = []; houses = []; trees = [];
      sessionKills = 0; scopeOn = false; stance = 'stand'; jumpZ = 0; jumpV = 0; inCar = false;
      document.getElementById('h-hp').innerText = '100'; document.getElementById('h-kills').innerText = '0';
      ['btn-scope','btn-car','btn-crouch','btn-prone'].forEach(i => document.getElementById(i).classList.remove('on'));
      [[350,350,150,110],[1400,320,170,120],[320,1400,160,120],[1450,1420,170,130],[720,650,130,95],[1160,1180,140,100]]
        .forEach(([x,y,w,h]) => houses.push({x,y,w,h}));
      for (let i=0;i<28;i++) trees.push({ x:80+Math.random()*(WORLD-160), y:80+Math.random()*(WORLD-160), r:24+Math.random()*14 });
      if (botIdx !== null && ARENA_BOTS[botIdx]) {
        const b = ARENA_BOTS[botIdx]; document.getElementById('h-mode').innerText = '⚔️ ' + b.name;
        spawnEnemy(b.skin, b.weapon, 160);
      } else {
        document.getElementById('h-mode').innerText = WEAPONS[eqW].icon + ' ' + WEAPONS[eqW].name;
        for (let i=0;i<9;i++) spawnEnemy();
      }
      running = true; if (animId) cancelAnimationFrame(animId); loop();
    }
    function exitGame() {
      running = false; firing = false; inBattle = false;
      if (animId) cancelAnimationFrame(animId);
      document.getElementById('scr-game').classList.remove('active');
      document.getElementById('scr-lobby').classList.add('active');
      saveAll();
    }
    function spawnEnemy(sk, wp, hp=100) {
      let ex, ey; do { ex=100+Math.random()*(WORLD-200); ey=100+Math.random()*(WORLD-200); } while (Math.hypot(ex-player.x,ey-player.y)<300);
      const ks = Object.keys(SKINS);
      enemies.push({ x:ex, y:ey, r:17, hp, maxHp:hp, angle:0, walk:0, skin:sk||ks[Math.floor(Math.random()*ks.length)], weapon:wp||'rifle', speed:1.7+Math.random()*0.9, lastFire:Date.now()+Math.random()*1200 });
    }
    function toggleScope() { scopeOn = !scopeOn; document.getElementById('btn-scope').classList.toggle('on', scopeOn); }
    function doJump() { if (jumpZ===0 && !inCar) { jumpV=7.5; stance='stand'; updSt(); } }
    function setStance(s) { if (!inCar) { stance = stance===s?'stand':s; updSt(); } }
    function updSt() { document.getElementById('btn-crouch').classList.toggle('on',stance==='crouch'); document.getElementById('btn-prone').classList.toggle('on',stance==='prone'); }
    function toggleCar() {
      if (eqC==='none') { alert('Avval Garajdan mashina sotib oling (200,000 UC)!'); return; }
      inCar = !inCar; if (inCar) stance='stand'; updSt(); document.getElementById('btn-car').classList.toggle('on', inCar);
    }
    function shoot() {
      if (inCar) return;
      const now = Date.now(), w = WEAPONS[eqW]; if (now - lastShot < w.rate) return; lastShot = now;
      let t = null, bd = w.rng+160;
      for (const e of enemies) { const d = Math.hypot(e.x-player.x,e.y-player.y); if (d<bd) { bd=d; t=e; } }
      const ang = t ? Math.atan2(t.y-player.y, t.x-player.x) : player.angle; player.angle = ang;
      if (w.melee) { slashT=10; for (let i=enemies.length-1;i>=0;i--) if (Math.hypot(enemies[i].x-player.x,enemies[i].y-player.y)<=w.rng) hitEnemy(i,w.dmg); }
      else bullets.push({ x:player.x+Math.cos(ang)*22, y:player.y+Math.sin(ang)*22, vx:Math.cos(ang)*w.spd, vy:Math.sin(ang)*w.spd, dmg:w.dmg, fp:true, col:w.col, life:w.rng/w.spd });
    }
    function hitEnemy(i, dmg) {
      const e = enemies[i]; if (!e) return; e.hp -= dmg;
      if (e.hp <= 0) {
        floats.push({ x:e.x, y:e.y-14, txt:'+100 UC', life:45 });
        enemies.splice(i,1); sessionKills++; totalKills++; uc += 100; saveAll();
        document.getElementById('h-kills').innerText = sessionKills;
        if (duelEnemy !== null) setTimeout(() => { if (running) { alert('🏆 Duelda yutdingiz! +100 UC'); exitGame(); } }, 300);
        else spawnEnemy();
      }
    }
    function resH(ent) {
      for (const h of houses) {
        const cx = Math.max(h.x,Math.min(ent.x,h.x+h.w)), cy = Math.max(h.y,Math.min(ent.y,h.y+h.h));
        const dx = ent.x-cx, dy = ent.y-cy, d = Math.hypot(dx,dy);
        if (d < ent.r && d > 0) { ent.x += (dx/d)*(ent.r-d); ent.y += (dy/d)*(ent.r-d); }
      }
    }
    function loop() { if (!running) return; update(); draw(); animId = requestAnimationFrame(loop); }
    function update() {
      const spd = inCar ? CARS[eqC].spd : (stance==='prone'?1.8:(stance==='crouch'?2.8:4.2)), mag = Math.hypot(joyVec.x,joyVec.y);
      if (mag > 0.08) { player.x+=joyVec.x*spd; player.y+=joyVec.y*spd; player.angle=Math.atan2(joyVec.y,joyVec.x); player.walk+=0.25; }
      player.x = Math.max(24,Math.min(WORLD-24,player.x)); player.y = Math.max(24,Math.min(WORLD-24,player.y)); resH(player);
      if (jumpZ>0||jumpV>0) { jumpZ+=jumpV; jumpV-=0.55; if (jumpZ<=0) { jumpZ=0; jumpV=0; } }
      if (firing) shoot(); if (slashT>0) slashT--;
      const now = Date.now();
      for (let i=enemies.length-1; i>=0; i--) {
        const e=enemies[i], dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy); e.angle = Math.atan2(dy,dx);
        if (inCar && mag>0.3 && d<36) { hitEnemy(i,120); continue; }
        if (d>150) { e.x+=(dx/d)*e.speed; e.y+=(dy/d)*e.speed; e.walk+=0.15; resH(e); }
        if (d<440 && now-e.lastFire>1500) { e.lastFire=now; bullets.push({x:e.x,y:e.y,vx:(dx/d)*7,vy:(dy/d)*7,dmg:9,fp:false,col:'#fb7185',life:65}); }
      }
      for (let i=bullets.length-1; i>=0; i--) {
        const b=bullets[i]; b.x+=b.vx; b.y+=b.vy; b.life--;
        if (b.life<=0 || b.x<0 || b.y<0 || b.x>WORLD || b.y>WORLD || houses.some(h=>b.x>h.x&&b.x<h.x+h.w&&b.y>h.y&&b.y<h.y+h.h)) { bullets.splice(i,1); continue; }
        if (b.fp) { for (let j=enemies.length-1;j>=0;j--) if (Math.hypot(b.x-enemies[j].x,b.y-enemies[j].y)<20) { hitEnemy(j,b.dmg); bullets.splice(i,1); break; } }
        else if (jumpZ<10 && Math.hypot(b.x-player.x,b.y-player.y)<(stance==='prone'?10:(stance==='crouch'?14:18))) {
          player.hp = Math.max(0, player.hp-(inCar?4:b.dmg)); document.getElementById('h-hp').innerText = player.hp; bullets.splice(i,1);
          if (player.hp<=0) { running=false; document.getElementById('go-txt').innerText='Kill: '+sessionKills+' | Balans: '+uc.toLocaleString()+' UC'; document.getElementById('go-modal').classList.add('open'); }
        }
      }
      for (let i=floats.length-1;i>=0;i--) { floats[i].y-=1; if (--floats[i].life<=0) floats.splice(i,1); }
    }
    function drawChar(x, y, ang, skId, wpId, walk, st, jz, isP) {
      const sk = SKINS[skId]||SKINS.soldier, wp = WEAPONS[wpId]||WEAPONS.starter;
      ctx.save(); ctx.translate(x,y);
      ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0,8,15,9,0,0,Math.PI*2); ctx.fill();
      ctx.translate(0,-jz); ctx.rotate(ang);
      const sc = st==='crouch'?0.85:(jz>0?1+jz*0.01:1); ctx.scale(sc,sc);
      const lo = Math.sin(walk)*5; ctx.fillStyle = sk.pants;
      if (st==='prone') { ctx.fillRect(-24,-6,20,5); ctx.fillRect(-24,2,20,5); } else { ctx.fillRect(-5+lo,-11,9,5); ctx.fillRect(-5-lo,6,9,5); }
      ctx.fillStyle = sk.body; ctx.fillRect(st==='prone'?-9:-10,-12,st==='prone'?22:18,24);
      ctx.fillStyle = wp.col; ctx.fillRect(8,4,wp.len||16,4);
      ctx.fillStyle = sk.head; ctx.beginPath(); ctx.arc(2,0,9.5,0,Math.PI*2); ctx.fill();
      if (skId==='inferno') { ctx.fillStyle='#fbbf24'; ctx.fillRect(-2,-13,6,4); ctx.fillRect(-2,9,6,4); }
      if (isP) { ctx.strokeStyle='#fff'; ctx.lineWidth=1.8; ctx.beginPath(); ctx.arc(2,0,9.5,0,Math.PI*2); ctx.stroke(); }
      ctx.restore();
    }
    function draw() {
      const W=canvas.width, H=canvas.height, z=scopeOn?1.35:1;
      ctx.fillStyle='#33522e'; ctx.fillRect(0,0,W,H);
      ctx.save(); ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-player.x,-player.y);
      ctx.fillStyle='#334155'; ctx.fillRect(0,WORLD/2-50,WORLD,100); ctx.fillRect(WORLD/2-50,0,100,WORLD);
      for (const h of houses) { ctx.fillStyle='#78350f'; ctx.fillRect(h.x,h.y,h.w,h.h); ctx.fillStyle='#92400e'; ctx.fillRect(h.x+10,h.y+10,h.w-20,h.h-20); }
      for (const t of trees) { ctx.fillStyle='#1b4320'; ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,Math.PI*2); ctx.fill(); }
      for (const e of enemies) { drawChar(e.x,e.y,e.angle,e.skin,e.weapon,e.walk,'stand',0,false); ctx.fillStyle='#111'; ctx.fillRect(e.x-16,e.y-26,32,4); ctx.fillStyle='#ef4444'; ctx.fillRect(e.x-16,e.y-26,32*(e.hp/e.maxHp),4); }
      if (scopeOn && !inCar) { ctx.strokeStyle='rgba(239,68,68,0.6)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(player.x,player.y); ctx.lineTo(player.x+Math.cos(player.angle)*340,player.y+Math.sin(player.angle)*340); ctx.stroke(); }
      if (slashT>0) { ctx.strokeStyle=WEAPONS[eqW].col; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(player.x,player.y,70,player.angle-1,player.angle+1); ctx.stroke(); }
      if (inCar) { const c=CARS[eqC]||CARS.lambo; ctx.save(); ctx.translate(player.x,player.y); ctx.rotate(player.angle); ctx.fillStyle=c.col; ctx.fillRect(-28,-15,56,30); ctx.fillStyle=c.col2; ctx.fillRect(-8,-12,20,24); ctx.restore(); }
      else drawChar(player.x,player.y,player.angle,eqS,eqW,player.walk,stance,jumpZ,true);
      for (const b of bullets) { ctx.fillStyle=b.col; ctx.beginPath(); ctx.arc(b.x,b.y,4.5,0,Math.PI*2); ctx.fill(); }
      ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; for (const f of floats) { ctx.fillStyle='#fde047'; ctx.fillText(f.txt,f.x,f.y); }
      ctx.restore();
      if (scopeOn) { ctx.strokeStyle='rgba(239,68,68,0.7)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(W/2,H/2,52,0,Math.PI*2); ctx.stroke(); }
      const ms=80, mx=W-ms-10, my=52; ctx.fillStyle='rgba(9,13,22,0.78)'; ctx.fillRect(mx,my,ms,ms); ctx.strokeStyle='#64748b'; ctx.strokeRect(mx,my,ms,ms);
      ctx.fillStyle='#38bdf8'; ctx.fillRect(mx+(player.x/WORLD)*ms-2,my+(player.y/WORLD)*ms-2,4,4);
      ctx.fillStyle='#ef4444'; for (const e of enemies) ctx.fillRect(mx+(e.x/WORLD)*ms-1,my+(e.y/WORLD)*ms-1,3,3);
    }

    const jz=document.getElementById('joy-zone'), jk=document.getElementById('joy-knob');
    function onJoy(e) {
      e.preventDefault(); const t=e.touches[0], r=jz.getBoundingClientRect();
      let dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2);
      const maxR=r.width/2-16, d=Math.hypot(dx,dy); if (d>maxR) { dx=(dx/d)*maxR; dy=(dy/d)*maxR; }
      jk.style.transform='translate('+dx+'px,'+dy+'px)'; joyVec.x=dx/maxR; joyVec.y=dy/maxR;
    }
    jz.addEventListener('touchstart',onJoy,{passive:false}); jz.addEventListener('touchmove',onJoy,{passive:false});
    jz.addEventListener('touchend',()=>{ joyVec={x:0,y:0}; jk.style.transform='translate(0,0)'; });
    const fb=document.getElementById('fire-btn');
    fb.addEventListener('touchstart',e=>{e.preventDefault();firing=true;shoot();},{passive:false});
    fb.addEventListener('touchend',()=>firing=false);
    fb.addEventListener('mousedown',()=>{firing=true;shoot();});
    fb.addEventListener('mouseup',()=>firing=false);
  </script>
</body>
</html>
