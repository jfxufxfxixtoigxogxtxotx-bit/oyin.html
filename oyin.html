<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PUBG 3D Arena</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #090d16; color: #fff; }
    .screen { display: none; width: 100%; height: 100%; position: relative; }
    .screen.active { display: block; }
    canvas { display: block; width: 100%; height: 100%; }

    /* Lobby HUD */
    .lb-top { position: absolute; top: 56px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 5; }
    .lb-prof { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: rgba(12,18,30,0.8); border: 1px solid rgba(255,255,255,0.2); border-left: 3px solid #facc15; padding: 6px 11px; border-radius: 8px; }
    .lb-right { pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .uc-pill { background: rgba(12,18,30,0.88); border: 1px solid #f59e0b; color: #fde047; padding: 5px 11px; border-radius: 8px; font-weight: 800; font-size: 13px; }
    .map-row { display: flex; gap: 4px; }
    .m-chip { background: rgba(12,18,30,0.82); border: 1px solid #475569; color: #e2e8f0; padding: 5px 8px; border-radius: 7px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .m-chip.on { border-color: #facc15; color: #fde047; background: rgba(250,204,21,0.18); }

    .lb-bot { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; z-index: 5; }
    .lb-start-row { display: flex; align-items: flex-end; justify-content: space-between; pointer-events: auto; gap: 8px; }
    .btn-pubg { background: linear-gradient(180deg,#fde047,#eab308); color: #111827; border: 2px solid #fef08a; border-radius: 7px; padding: 12px 26px; font-size: 17px; font-weight: 900; cursor: pointer; box-shadow: 0 5px 18px rgba(234,179,8,0.45); }
    .tag { background: rgba(12,18,30,0.82); border: 1px solid rgba(255,255,255,0.2); padding: 5px 9px; border-radius: 7px; font-size: 11px; color: #e2e8f0; }
    .lb-nav { pointer-events: auto; display: flex; gap: 4px; background: rgba(12,18,30,0.9); border-top: 1px solid rgba(255,255,255,0.2); padding: 6px 4px; border-radius: 10px; }
    .nav-b { flex: 1; padding: 7px 2px; border: none; border-radius: 7px; background: transparent; color: #e2e8f0; font-size: 10px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .nav-b:active { background: rgba(250,204,21,0.2); color: #fde047; }

    /* Inventory / Shop Drawer */
    .drawer-bg { position: absolute; inset: 0; background: rgba(6,10,18,0.78); display: none; align-items: flex-end; z-index: 25; }
    .drawer-bg.open { display: flex; }
    .drawer { width: 100%; max-height: 76dvh; background: #111827; border-top: 2px solid #facc15; border-radius: 18px 18px 0 0; padding: 14px; display: flex; flex-direction: column; }
    .d-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-shrink: 0; }
    .d-exit { background: #dc2626; color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-weight: 800; font-size: 12px; cursor: pointer; }
    .d-body { overflow-y: auto; flex: 1; padding-bottom: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .card { background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 9px; display: flex; flex-direction: column; justify-content: space-between; font-size: 12px; }
    .card.eq { border-color: #22c55e; background: rgba(34,197,94,0.14); }
    .c-btn { width: 100%; padding: 7px; border: none; border-radius: 7px; font-weight: 800; font-size: 11px; cursor: pointer; background: #f59e0b; color: #111; margin-top: 6px; }
    .c-btn.own { background: #334155; color: #fff; }
    .c-btn.eq { background: #22c55e; color: #052e16; }
    .box { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px; font-size: 12px; margin-bottom: 10px; }
    .inp { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #334155; background: #090d16; color: #fff; margin: 6px 0; }

    /* 3D Game HUD */
    #scr-game { background: #1e293b; }
    #c3d { touch-action: none; }
    .hud-tl { position: absolute; top: 10px; left: 10px; display: flex; gap: 5px; z-index: 10; }
    .h-box { background: rgba(0,0,0,0.68); border: 1px solid rgba(255,255,255,0.22); padding: 5px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; }
    .compass { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.55); padding: 4px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; z-index: 10; }
    .hud-tr { position: absolute; top: 10px; right: 10px; z-index: 10; }
    @media (orientation: portrait) { .hud-tl, .hud-tr, .compass { top: 52px; } }
    .minimap { width: 72px; height: 72px; background: rgba(15,23,42,0.82); border: 1.5px solid #cbd5e1; border-radius: 6px; }
    .crosshair { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid rgba(255,255,255,0.88); border-radius: 50%; pointer-events: none; z-index: 9; }

    .joy { position: absolute; bottom: 18px; left: 18px; width: 104px; height: 104px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.3); touch-action: none; z-index: 10; }
    .knob { position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px; border-radius: 50%; background: rgba(255,255,255,0.82); pointer-events: none; }
    .bot-mid { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 3px; z-index: 10; }
    .bar-w { width: 130px; height: 9px; background: #1e293b; border: 1px solid rgba(255,255,255,0.5); border-radius: 6px; overflow: hidden; }
    .hp-fill { height: 100%; background: #22c55e; width: 100%; }
    .arm-fill { height: 100%; background: #38bdf8; width: 100%; }

    .acts { position: absolute; bottom: 14px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 10; }
    .act-r { display: flex; gap: 6px; }
    .ab { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.35); background: rgba(0,0,0,0.68); color: #fff; font-size: 10px; font-weight: 700; cursor: pointer; }
    .ab.on { border-color: #facc15; background: rgba(234,179,8,0.4); }
    .fire { width: 74px; height: 74px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.6); background: radial-gradient(#ef4444,#991b1b); color: #fff; font-weight: 900; font-size: 13px; touch-action: none; }
    .end-ov { position: absolute; inset: 0; background: rgba(0,0,0,0.86); display: none; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
    .end-ov.open { display: flex; }
    .end-card { background: #1e293b; border: 2px solid #facc15; border-radius: 16px; padding: 18px; text-align: center; max-width: 340px; width: 100%; }
  </style>
</head>
<body>

  <!-- 1. SCENIC PUBG LOBBY -->
  <div class="screen active" id="scr-lobby">
    <canvas id="lobby-canvas"></canvas>

    <div class="lb-top">
      <div class="lb-prof">
        <div style="font-size:20px;">🎖️</div>
        <div>
          <div style="font-weight:800;font-size:13px;" id="u-name">O‘yinchi</div>
          <div style="font-size:11px;color:#fde047;">Lvl <span id="u-lvl">1</span> • ☠️ <span id="u-kills">0</span></div>
        </div>
      </div>
      <div class="lb-right">
        <div class="uc-pill">💵 <span id="u-uc">0</span> UC</div>
        <div class="map-row">
          <button class="m-chip on" onclick="setMap('erangel',this)">🏝️ Erangel</button>
          <button class="m-chip" onclick="setMap('park',this)">🎡 Park</button>
          <button class="m-chip" onclick="setMap('build',this)">🏠 Uy</button>
        </div>
      </div>
    </div>

    <div class="lb-bot">
      <div class="lb-start-row">
        <div>
          <div class="tag" style="margin-bottom:4px;width:fit-content;" id="lb-gear">🔫 M416 • ❤️ 250</div>
          <button class="btn-pubg" onclick="start3D()">BOSHLASH</button>
        </div>
        <div class="tag">🐼 Panda • Yotqizib o‘ynang</div>
      </div>

      <div class="lb-nav">
        <button class="nav-b" onclick="openD('weapons')">🔫 Qurol</button>
        <button class="nav-b" onclick="openD('armor')">🛡️ Bron</button>
        <button class="nav-b" onclick="openD('outfits')">👕 Kiyim</button>
        <button class="nav-b" onclick="openD('cars')">🚗 Garaj</button>
        <button class="nav-b" onclick="openD('house')">🏢 Uy</button>
        <button class="nav-b" onclick="openD('menu')">💳 Menyu</button>
      </div>
    </div>

    <div class="drawer-bg" id="d-bg" onclick="if(event.target===this)closeD()">
      <div class="drawer">
        <div class="d-head">
          <div style="font-weight:800;font-size:15px;" id="d-title">Do‘kon</div>
          <button class="d-exit" onclick="closeD()">✖ Chiqish</button>
        </div>
        <div class="d-body" id="d-body"></div>
      </div>
    </div>
  </div>

  <!-- 2. 3D BATTLE ARENA -->
  <div class="screen" id="scr-game">
    <canvas id="c3d"></canvas>
    <div class="hud-tl">
      <button class="h-box" style="background:#dc2626;border:none;color:#fff;" onclick="exit3D()">✖ Chiqish</button>
      <div class="h-box">Qolgan <span id="g-alive">100</span></div>
      <div class="h-box">Kill <span id="g-kills">0</span></div>
      <div class="h-box" id="g-wep">M416</div>
    </div>
    <div class="compass">NW • N • NE</div>
    <div class="hud-tr"><canvas class="minimap" id="mmap" width="72" height="72"></canvas></div>
    <div class="crosshair"></div>

    <div class="joy" id="joy"><div class="knob" id="knob"></div></div>

    <div class="bot-mid">
      <div class="h-box" id="hp-txt">❤️ 250 | 🛡️ 0</div>
      <div class="bar-w"><div class="arm-fill" id="arm-fill"></div></div>
      <div class="bar-w"><div class="hp-fill" id="hp-fill"></div></div>
    </div>

    <div class="acts">
      <div class="act-r">
        <button class="ab" onclick="dropVehicle()">🪂<span>Chaqir</span></button>
        <button class="ab" id="b-car" onclick="toggleVehicle()">🚗<span>Min</span></button>
        <button class="ab" id="b-scope" onclick="toggleScope()">🎯<span>Pritsel</span></button>
      </div>
      <div class="act-r">
        <button class="ab" onclick="doJump()">🦵<span>Sakra</span></button>
        <button class="ab" id="b-crouch" onclick="setStance('crouch')">🙇<span>O‘tir</span></button>
        <button class="ab" id="b-prone" onclick="setStance('prone')">🛌<span>Yot</span></button>
      </div>
      <button class="fire" id="fire-btn">OTISH 🔥</button>
    </div>

    <div class="end-ov" id="end-ov">
      <div class="end-card">
        <h2 id="end-title" style="margin:0 0 8px;"></h2>
        <p id="end-desc" style="font-size:13px;color:#cbd5e1;margin:0 0 14px;"></p>
        <div style="display:flex;gap:8px;">
          <button class="btn-pubg" style="flex:1;padding:11px;font-size:14px;" onclick="start3D()">🔄 Match</button>
          <button class="btn-pubg" style="flex:1;padding:11px;font-size:14px;background:#334155;color:#fff;border-color:#64748b;" onclick="exit3D()">🏠 Lobbi</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    let uid = '0000', uname = 'O‘yinchi';
    try {
      if (tg) {
        tg.ready(); tg.expand();
        if (tg.requestFullscreen) tg.requestFullscreen();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
          uid = String(tg.initDataUnsafe.user.id); uname = tg.initDataUnsafe.user.first_name;
        }
      }
    } catch (e) {}
    document.getElementById('u-name').innerText = uname;

    /* 100 Qurol (50-100 UC) har xil zarba va tezlikda */
    const BASES = [
      ['M416',34,115],['AKM',42,135],['AWM',115,620],['Kar98k',92,540],['Scar-L',35,120],
      ['Groza',46,105],['M762',44,115],['UMP45',30,98],['Vector',26,75],['DP-28',40,130]
    ];
    const W_SKINS = [
      ['Muzlik',0x38bdf8],['Oltin',0xfacc15],['Firavn',0xeab308],['Ajdar',0xef4444],['Qonli',0xbe123c],
      ['Kiber',0xa855f7],['Neon',0x22d3ee],['Qora',0x18181b],['Zahar',0x22c55e],['Kumush',0xcbd5e1]
    ];
    const WEAPONS = [];
    for (let i=0;i<10;i++) for (let j=0;j<10;j++) {
      const idx = i*10+j;
      WEAPONS.push({
        id:'w'+idx, name:BASES[i][0]+' '+W_SKINS[j][0],
        price: idx===0 ? 0 : 50 + ((i+j)%6)*10,
        dmg: BASES[i][1] + j*2, rate: BASES[i][2], col: W_SKINS[j][1]
      });
    }

    const ARMORS = [
      { id:'a0', name:'Oddiy', price:0, shield:0, red:0, col:0x334155 },
      { id:'a1', name:'1-daraja Kaska+Bron', price:100, shield:80, red:0.25, col:0x64748b },
      { id:'a2', name:'2-daraja Kaska+Bron', price:300, shield:150, red:0.45, col:0x2563eb },
      { id:'a3', name:'3-daraja Spetsnaz', price:700, shield:220, red:0.62, col:0x111827 },
      { id:'a4', name:'Inferno Oltin Bron', price:1500, shield:320, red:0.78, col:0xf59e0b }
    ];

    const OUTFITS = [
      ['Inferno & Qora',0x18181b,0xea580c,0],['Fir‘avn Oltin',0xeab308,0x1d4ed8,1200],['Mumiya Oq',0xf1f5f9,0xe2e8f0,1500],
      ['Ravon Maxsus',0x0f172a,0x38bdf8,1800],['Joker Kostyum',0x7c3aed,0x22c55e,2200],['Godzilla',0x1e3a8a,0x06b6d4,2800],
      ['Kiber X-Suit',0x4c1d95,0xf472b6,3500],['Qonli Ritsar',0x991b1b,0xfacc15,4200],['Tilla X-Suit',0xd97706,0xfef08a,5000]
    ].map((x,i)=>({id:'s'+i,name:x[0],body:x[1],helm:x[2],price:x[3]}));

    const CARS = [
      { id:'matiz', name:'Matiz', price:50000, col:0x38bdf8, hex:'#38bdf8', spd:0.42, type:'car' },
      { id:'tiko', name:'Tiko', price:55000, col:0xef4444, hex:'#ef4444', spd:0.40, type:'car' },
      { id:'damas', name:'Damas', price:65000, col:0xf8fafc, hex:'#f8fafc', spd:0.38, type:'van' },
      { id:'malibu1', name:'Malibu 1', price:90000, col:0x334155, hex:'#334155', spd:0.48, type:'car' },
      { id:'gentra', name:'Gentra', price:110000, col:0x1e293b, hex:'#1e293b', spd:0.50, type:'car' },
      { id:'malibu2', name:'Malibu 2 Qopqora', price:150000, col:0x050507, hex:'#09090b', spd:0.56, type:'car' },
      { id:'lambo', name:'Lamborghini', price:180000, col:0xfacc15, hex:'#facc15', spd:0.68, type:'car' },
      { id:'bugatti', name:'Bugatti', price:200000, col:0x2563eb, hex:'#2563eb', spd:0.72, type:'car' },
      { id:'tank', name:'Harbiy Tank', price:190000, col:0x3f6212, hex:'#3f6212', spd:0.36, type:'tank' },
      { id:'heli', name:'Vertolyot', price:200000, col:0x0f172a, hex:'#0f172a', spd:0.75, type:'heli' }
    ];

    let uc = Number(localStorage.getItem('p3_uc') || localStorage.getItem('br_uc') || localStorage.getItem('pg_uc') || 0);
    let kills = Number(localStorage.getItem('p3_kills') || 0);
    let floors = Number(localStorage.getItem('p3_floors') || 1);
    let ownW = JSON.parse(localStorage.getItem('p3_ow') || '["w0"]');
    let eqW = localStorage.getItem('p3_ew') || 'w0';
    let ownA = JSON.parse(localStorage.getItem('p3_oa') || '["a0"]');
    let eqA = localStorage.getItem('p3_ea') || 'a0';
    let ownS = JSON.parse(localStorage.getItem('p3_os') || '["s0"]');
    let eqS = localStorage.getItem('p3_es') || 's0';
    let ownC = JSON.parse(localStorage.getItem('p3_oc') || '[]');
    let eqC = localStorage.getItem('p3_ec') || 'malibu2';
    let curMap = 'erangel', curD = 'weapons';
    let chatMsgs = JSON.parse(localStorage.getItem('p3_chat') || '["Aziz: Salom hammaga!"]');
    let clanName = localStorage.getItem('p3_clan') || 'Klan yo‘q';

    function save() {
      localStorage.setItem('p3_uc',uc); localStorage.setItem('p3_kills',kills); localStorage.setItem('p3_floors',floors);
      localStorage.setItem('p3_ow',JSON.stringify(ownW)); localStorage.setItem('p3_ew',eqW);
      localStorage.setItem('p3_oa',JSON.stringify(ownA)); localStorage.setItem('p3_ea',eqA);
      localStorage.setItem('p3_os',JSON.stringify(ownS)); localStorage.setItem('p3_es',eqS);
      localStorage.setItem('p3_oc',JSON.stringify(ownC)); localStorage.setItem('p3_ec',eqC);
      document.getElementById('u-uc').innerText = uc.toLocaleString();
      document.getElementById('u-kills').innerText = kills;
      document.getElementById('u-lvl').innerText = 1 + Math.floor(kills/5);
      const w = WEAPONS.find(x=>x.id===eqW)||WEAPONS[0], a = ARMORS.find(x=>x.id===eqA)||ARMORS[0];
      document.getElementById('lb-gear').innerText = '🔫 '+w.name+' • 🛡️ '+a.shield;
    }

    function setMap(m, btn) { curMap=m; document.querySelectorAll('.m-chip').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
    function openD(t) { curD=t; document.getElementById('d-bg').classList.add('open'); renderD(); }
    function closeD() { document.getElementById('d-bg').classList.remove('open'); }

    function renderD() {
      const titles = { weapons:'🔫 Qurollar (100 xil)', armor:'🛡️ Kaska va Bronjiletlar', outfits:'👕 PUBG Kiyimlar', cars:'🚗 Garaj', house:'🏢 Uy Qurish (1-8 qavat)', menu:'💳 UC, Do‘st, Klan & Chat' };
      document.getElementById('d-title').innerText = titles[curD];
      const box = document.getElementById('d-body');
      if (curD==='weapons') {
        box.innerHTML = '<div class="grid">' + WEAPONS.map(w => {
          const isO=ownW.includes(w.id), isE=eqW===w.id;
          return '<div class="card '+(isE?'eq':'')+'"><b>'+w.name+'</b><div>Zarba: '+w.dmg+' | Tez: '+Math.round(1000/w.rate)+'</div>' +
            '<button class="c-btn '+(isE?'eq':(isO?'own':''))+'" onclick="buyG(\'w\',\''+w.id+'\')">'+(isE?'✅ Tanlangan':(isO?'Tanlash':w.price+' UC'))+'</button></div>';
        }).join('') + '</div>';
      } else if (curD==='armor') {
        box.innerHTML = '<div class="grid">' + ARMORS.filter(a=>a.price>0).map(a => {
          const isO=ownA.includes(a.id), isE=eqA===a.id;
          return '<div class="card '+(isE?'eq':'')+'"><b>🛡️ '+a.name+'</b><div>Qalqon: +'+a.shield+' (-'+Math.round(a.red*100)+'% zarar)</div>' +
            '<button class="c-btn '+(isE?'eq':(isO?'own':''))+'" onclick="buyG(\'a\',\''+a.id+'\')">'+(isE?'✅ Tanlangan':(isO?'Tanlash':a.price+' UC'))+'</button></div>';
        }).join('') + '</div>';
      } else if (curD==='outfits') {
        box.innerHTML = '<div class="grid">' + OUTFITS.map(s => {
          const isO=ownS.includes(s.id), isE=eqS===s.id;
          return '<div class="card '+(isE?'eq':'')+'"><b>👕 '+s.name+'</b>' +
            '<button class="c-btn '+(isE?'eq':(isO?'own':''))+'" onclick="buyG(\'s\',\''+s.id+'\')">'+(isE?'✅ Tanlangan':(isO?'Tanlash':s.price.toLocaleString()+' UC'))+'</button></div>';
        }).join('') + '</div>';
      } else if (curD==='cars') {
        box.innerHTML = '<div class="grid">' + CARS.map(c => {
          const isO=ownC.includes(c.id), isE=eqC===c.id;
          return '<div class="card '+(isE?'eq':'')+'"><b>🚗 '+c.name+'</b><div>Tezlik: '+Math.round(c.spd*200)+'</div>' +
            '<button class="c-btn '+(isE?'eq':(isO?'own':''))+'" onclick="buyG(\'c\',\''+c.id+'\')">'+(isE?'✅ Tanlangan':(isO?'Tanlash':c.price.toLocaleString()+' UC'))+'</button></div>';
        }).join('') + '</div>';
      } else if (curD==='house') {
        let h = '<div class="box">Hozirgi uyingiz: <b>'+floors+' qavatli</b></div><div class="grid">';
        for (let f=1;f<=8;f++) {
