<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PUBG Lobby & Arena</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100dvh; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b101b; color: #f8fafc;
    }
    .screen { display: none; width: 100%; height: 100%; position: relative; }
    .screen.active { display: block; }
    canvas { display: block; width: 100%; height: 100%; }

    /* PUBG Lobby HUD */
    .lb-top {
      position: absolute; top: 50px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none;
    }
    .lb-prof {
      pointer-events: auto; display: flex; align-items: center; gap: 8px;
      background: rgba(12,18,30,0.75); border: 1px solid rgba(255,255,255,0.2);
      border-left: 3px solid #facc15; padding: 6px 12px 6px 8px; border-radius: 8px; backdrop-filter: blur(6px);
    }
    .lb-ava {
      width: 34px; height: 34px; border-radius: 6px; background: linear-gradient(135deg,#f59e0b,#b45309);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .lb-right { pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .uc-pill {
      background: rgba(12,18,30,0.82); border: 1px solid #f59e0b; color: #fde047;
      padding: 5px 12px; border-radius: 8px; font-weight: 800; font-size: 13px;
    }
    .mini-btns { display: flex; gap: 6px; }
    .sq-btn {
      background: rgba(12,18,30,0.78); border: 1px solid rgba(255,255,255,0.22);
      color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
    }

    .lb-bot {
      position: absolute; left: 10px; right: 10px; bottom: 12px;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .lb-start-row { display: flex; align-items: flex-end; justify-content: space-between; pointer-events: auto; }
    .start-box { display: flex; flex-direction: column; gap: 4px; }
    .mode-tag {
      background: rgba(12,18,30,0.78); border: 1px solid rgba(255,255,255,0.2);
      padding: 4px 10px; border-radius: 6px; font-size: 11px; color: #e2e8f0; width: fit-content;
    }
    .btn-pubg {
      background: linear-gradient(180deg, #fde047 0%, #eab308 100%);
      color: #111827; border: 2px solid #fef08a; border-radius: 6px;
      padding: 13px 32px; font-size: 18px; font-weight: 900; letter-spacing: 0.6px;
      box-shadow: 0 6px 20px rgba(234,179,8,0.45); cursor: pointer;
    }
    .lb-nav {
      pointer-events: auto; display: flex; gap: 5px;
      background: rgba(12,18,30,0.84); border-top: 1px solid rgba(255,255,255,0.18);
      padding: 6px; border-radius: 10px; backdrop-filter: blur(8px);
    }
    .nav-item {
      flex: 1; padding: 7px 2px; border: none; border-radius: 7px;
      background: transparent; color: #e2e8f0; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .nav-item:active { background: rgba(250,204,21,0.2); color: #fde047; }

    /* Drawer Modal */
    .drawer-bg {
      position: absolute; inset: 0; background: rgba(6,10,18,0.75); backdrop-filter: blur(5px);
      display: none; align-items: flex-end; z-index: 25;
    }
    .drawer-bg.open { display: flex; }
    .drawer {
      width: 100%; max-height: 76dvh; background: #111827; border-top: 2px solid #f59e0b;
      border-radius: 20px 20px 0 0; padding: 14px; display: flex; flex-direction: column;
    }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .drawer-body { overflow-y: auto; flex: 1; padding-bottom: 10px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .card {
      background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 14px; padding: 11px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .card.eq { border-color: #22c55e; background: rgba(34,197,94,0.12); }
    .c-btn {
      width: 100%; padding: 8px; border-radius: 8px; border: none;
      font-weight: 800; font-size: 12px; cursor: pointer; background: #f59e0b; color: #111;
    }
    .c-btn.own { background: #334155; color: #fff; }
    .c-btn.eq { background: #22c55e; color: #052e16; }
    .list-row {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 9px 12px; margin-bottom: 7px; font-size: 13px; cursor: pointer;
    }
    .wd-inp {
      width: 100%; padding: 11px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
      background: #0b101b; color: #fff; margin: 6px 0 10px; font-size: 14px;
    }

    /* Game HUD */
    #scr-game { background: #2c4728; }
    #game-canvas { touch-action: none; }
    .hud-top {
      position: absolute; top: 52px; left: 10px; right: 100px;
      display: flex; flex-wrap: wrap; gap: 5px; pointer-events: none; z-index: 10;
    }
    .hud-pill {
      background: rgba(9,13,22,0.8); border: 1px solid rgba(255,255,255,0.2);
      padding: 5px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; pointer-events: auto;
    }
    .exit-btn { background: rgba(239,68,68,0.9); color: #fff; border: none; cursor: pointer; }
    .joy-zone {
      position: absolute; bottom: 20px; left: 18px; width: 114px; height: 114px;
      border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.28);
      touch-action: none; z-index: 10;
    }
    .joy-knob {
      position: absolute; left: 50%; top: 50%; width: 46px; height: 46px;
      margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,0.82); pointer-events: none;
    }
    .act-pad {
      position: absolute; bottom: 18px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; z-index: 10;
    }
    .act-row { display: flex; gap: 6px; }
    .act-btn {
      width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3);
      background: rgba(15,23,42,0.82); color: #fff; font-size: 10px; font-weight: 700;
      display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
    }
    .act-btn.on { border-color: #fbbf24; background: rgba(245,158,11,0.35); }
    .fire-btn {
      width: 82px; height: 82px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.55);
      background: radial-gradient(circle,#ef4444,#991b1b); color: #fff; font-weight: 800; font-size: 14px; touch-action: none;
    }
    .go-overlay {
      position: absolute; inset: 0; background: rgba(9,13,22,0.88);
      display: none; align-items: center; justify-content: center; padding: 20px; z-index: 30;
    }
    .go-overlay.open { display: flex; }
    .go-card { width: 100%; max-width: 320px; background: #1e293b; border-radius: 18px; padding: 20px; text-align: center; }
  </style>
</head>
<body>

  <!-- 1. PUBG Style Lobby -->
  <div class="screen active" id="scr-lobby">
    <canvas id="lobby-canvas"></canvas>

    <div class="lb-top">
      <div class="lb-prof">
        <div class="lb-ava">🎖️</div>
        <div>
          <div style="font-weight:800;font-size:13px;" id="p-name">O‘yinchi</div>
          <div style="font-size:11px;color:#fde047;">☠️ <span id="p-kills">0</span> Kill • VIP</div>
        </div>
      </div>
      <div class="lb-right">
        <div class="uc-pill">💵 <span id="uc-bal">0</span> UC</div>
        <div class="mini-btns">
          <button class="sq-btn" onclick="openDrawer('shop')">🛒 Do‘kon</button>
          <button class="sq-btn" onclick="openDrawer('top')">🏆 Top 100</button>
        </div>
      </div>
    </div>

    <div class="lb-bot">
      <div class="lb-start-row">
        <div class="start-box">
          <div class="mode-tag">🗺️ Erangel Arena • 3-shaxs</div>
          <button class="btn-pubg" onclick="startGame(null)">BOSHLASH</button>
        </div>
        <div class="mode-tag" id="lb-eq-info">🔫 Oddiy • 🐼 Panda</div>
      </div>
      <div class="lb-nav">
        <button class="nav-item" onclick="openDrawer('shop')">🔫 Qurol</button>
        <button class="nav-item" onclick="openDrawer('skins')">👕 Skin</button>
        <button class="nav-item" onclick="openDrawer('garage')">🚗 Garaj</button>
        <button class="nav-item" onclick="openDrawer('arena')">⚔️ Raqib</button>
        <button class="nav-item" onclick="openDrawer('wd')">💳 UC</button>
      </div>
    </div>

    <div class="drawer-bg" id="drawer-bg" onclick="if(event.target===this)closeDrawer()">
      <div class="drawer">
        <div class="drawer-head">
          <div style="font-weight:800;font-size:16px;" id="drawer-title">Do‘kon</div>
          <button class="sq-btn" onclick="closeDrawer()">✕ Yopish</button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
      </div>
    </div>
  </div>

  <!-- 2. Battle Arena -->
  <div class="screen" id="scr-game">
    <canvas id="game-canvas"></canvas>
    <div class="hud-top">
      <button class="hud-pill exit-btn" onclick="exitGame()">✖ Chiqish</button>
      <div class="hud-pill">❤️ <span id="h-hp">100</span></div>
      <div class="hud-pill">💵 <span id="h-uc">0</span></div>
      <div class="hud-pill">☠️ <span id="h-kills">0</span></div>
      <div class="hud-pill" id="h-mode">Arena</div>
    </div>
    <div class="joy-zone" id="joy-zone"><div class="joy-knob" id="joy-knob"></div></div>
    <div class="act-pad">
      <div class="act-row">
        <button class="act-btn" id="btn-car" onclick="toggleCar()">🚗<span>Mashina</span></button>
        <button class="act-btn" id="btn-scope" onclick="toggleScope()">🎯<span>Pritsel</span></button>
      </div>
      <div class="act-row">
        <button class="act-btn" onclick="doJump()">🦵<span>Sakrash</span></button>
        <button class="act-btn" id="btn-crouch" onclick="setStance('crouch')">🙇<span>O‘tir</span></button>
        <button class="act-btn" id="btn-prone" onclick="setStance('prone')">🛌<span>Yot</span></button>
      </div>
      <button class="fire-btn" id="fire-btn">OTISH 🔥</button>
    </div>
    <div class="go-overlay" id="go-modal">
      <div class="go-card">
        <h2 style="margin:0 0 8px;">💥 Mag‘lub bo‘ldingiz!</h2>
        <p style="font-size:14px;color:#cbd5e1;" id="go-txt"></p>
        <button class="btn-pubg" style="width:100%;margin-bottom:8px;font-size:15px;" onclick="startGame(duelEnemy)">🔄 Qayta o‘ynash</button>
        <button class="sq-btn" style="width:100%;padding:12px;" onclick="exitGame()">🏠 Lobbiga qaytish</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    let playerName = 'Aziz_UZ';
    if (tg) {
      tg.ready(); tg.expand();
      if (tg.requestFullscreen) { try { tg.requestFullscreen(); } catch (e) {} }
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) playerName = tg.initDataUnsafe.user.first_name;
    }
    document.getElementById('p-name').innerText = playerName;

    const WEAPONS = {
      starter:   { id:'starter',   icon:'🔫', name:'Boshlang‘ich',   desc:'Oddiy qurol', price:0,  dmg:35,  rate:380, spd:12, rng:280, col:'#fde047', len:14 },
      karambit:  { id:'karambit',  icon:'🌙', name:'Kerambit',       desc:'Kamalak pichoq', price:35, dmg:110, rate:260, spd:12, rng:115, col:'#2dd4bf', melee:true, len:16 },
      butterfly: { id:'butterfly', icon:'🦋', name:'Babochka',       desc:'Neon pichoq', price:35, dmg:105, rate:240, spd:12, rng:115, col:'#e879f9', melee:true, len:16 },
      knife:     { id:'knife',     icon:'🔪', name:'Pichoq Crimson', desc:'Qizil taktik', price:35, dmg:100, rate:280, spd:12, rng:110, col:'#fb7185', melee:true, len:15 },
      pistol:    { id:'pistol',    icon:'🟡', name:'To‘pponcha Oltin',desc:'Oltin rang', price:35, dmg:55, rate:280, spd:15, rng:440, col:'#facc15', len:16 },
      rifle:     { id:'rifle',     icon:'💠', name:'Avtomat AKM',    desc:'Muz-Neon rang', price:35, dmg:36, rate:105, spd:17, rng:540, col:'#38bdf8', len:24 },
      sniper:    { id:'sniper',    icon:'🔴', name:'Snayper AWM',    desc:'Ajdar qizil', price:35, dmg:135, rate:680, spd:25, rng:820, col:'#f87171', len:30 }
    };

    const SKINS = {
      soldier: { id:'soldier', icon:'🥋', name:'Oq Komando',   price:0,   body:'#f1f5f9', pants:'#1e293b', head:'#334155', accent:'#94a3b8' },
      pharaoh: { id:'pharaoh', icon:'👑', name:'Fir‘avn',      price:150, body:'#eab308', pants:'#1d4ed8', head:'#1d4ed8', accent:'#fef08a' },
      mummy:   { id:'mummy',   icon:'🧻', name:'Mumiya',       price:150, body:'#e2e8f0', pants:'#cbd5e1', head:'#f8fafc', accent:'#22d3ee' },
      inferno: { id:'inferno', icon:'👹', name:'Inferno Kaska',price:150, body:'#18181b', pants:'#27272a', head:'#ea580c', accent:'#fde047' },
      cyber:   { id:'cyber',   icon:'🤖', name:'Kiber Jangar', price:150, body:'#7c3aed', pants:'#312e81', head:'#06b6d4', accent:'#f472b6' }
    };

    const CARS = {
      none:    { id:'none',    icon:'🚗', name:'Standart Qizil', price:0,      col:'#dc2626', col2:'#1e293b', spd:0 },
      lambo:   { id:'lambo',   icon:'🏎️', name:'Lamborghini',    price:200000, col:'#facc15', col2:'#111827', spd:8.8 },
      bugatti: { id:'bugatti', icon:'🚙', name:'Bugatti',        price:200000, col:'#2563eb', col2:'#0f172a', spd:9.2 },
      malibu2: { id:'malibu2', icon:'🚘', name:'Malibu 2',       price:200000, col:'#f8fafc', col2:'#1e293b', spd:8.0 }
    };

    let uc = Number(localStorage.getItem('br_uc') || 0);
    let totalKills = Number(localStorage.getItem('br_kills') || 0);
    let ownW = JSON.parse(localStorage.getItem('br_ow') || '["starter"]');
    let eqW = localStorage.getItem('br_ew') || 'starter';
    let ownS = JSON.parse(localStorage.getItem('br_os') || '["soldier"]');
    let eqS = localStorage.getItem('br_es') || 'soldier';
    let ownC = JSON.parse(localStorage.getItem('br_oc') || '["none"]');
    let eqC = localStorage.getItem('br_ec') || 'none';
    let activeTab = 'shop';

    function saveAll() {
      localStorage.setItem('br_uc', uc);
      localStorage.setItem('br_kills', totalKills);
      localStorage.setItem('br_ow', JSON.stringify(ownW)); localStorage.setItem('br_ew', eqW);
      localStorage.setItem('br_os', JSON.stringify(ownS)); localStorage.setItem('br_es', eqS);
      localStorage.setItem('br_oc', JSON.stringify(ownC)); localStorage.setItem('br_ec', eqC);
      document.getElementById('uc-bal').innerText = uc.toLocaleString();
      document.getElementById('h-uc').innerText = uc.toLocaleString();
      document.getElementById('p-kills').innerText = totalKills;
      document.getElementById('lb-eq-info').innerText = WEAPONS[eqW].icon + ' ' + WEAPONS[eqW].name + ' • 🐼 Panda';
    }

    const ARENA_BOTS = Array.from({ length: 99 }, (_, i) => {
      const n = ['Sardor_Pro','Azizbek_UZ','Shohruh_99','Jasur_PUBG','Bekzod_AWM','Mirjalol','Doston_X','Samandar','Ulugbek_VIP','Timur_King'];
      return {
        name: n[i % n.length] + '_' + (10 + i),
        kills: Math.max(2, 320 - i*3 + (i%4)),
        uc: Math.max(200, (320 - i*3)*100),
        skin: ['pharaoh','mummy','inferno','cyber','soldier'][i % 5],
        weapon: ['sniper','rifle','karambit','butterfly','pistol'][i % 5]
      };
    });

    function openDrawer(tab) {
      activeTab = tab;
      document.getElementById('drawer-bg').classList.add('open');
      renderDrawer();
    }
    function closeDrawer() { document.getElementById('drawer-bg').classList.remove('open'); }

    function renderGridHtml(dict, ownArr, eqId, type) {
      return '<div class="grid-2">' + Object.values(dict).filter(x => x.price > 0).map(x => {
        const isOwn = ownArr.includes(x.id), isEq = eqId === x.id;
        const cls = isEq ? 'c-btn eq' : (isOwn ? 'c-btn own' : 'c-btn');
        const txt = isEq ? '✅ Tanlangan' : (isOwn ? 'Tanlash' : '💵 ' + x.price.toLocaleString() + ' UC');
        return '<div class="card ' + (isEq ? 'eq' : '') + '">' +
          '<div><div style="font-size:26px;margin-bottom:4px;">' + x.icon + '</div>' +
          '<div style="font-weight:700;font-size:14px;">' + x.name + '</div>' +
          '<div style="font-size:11px;color:#94a3b8;margin-bottom:8px;">' + (x.desc || 'Maxsus') + '</div></div>' +
          '<button class="' + cls + '" onclick="buyItem(\'' + type + '\',\'' + x.id + '\')">' + txt + '</button></div>';
      }).join('') + '</div>';
    }

    function renderDrawer() {
      const titles = { shop:'🔫 Qurol Do‘koni (35 UC)', skins:'👕 Skin va Kaskalar', garage:'🚗 Garaj (200,000 UC)', arena:'⚔️ Arena Raqiblari', top:'🏆 Top 100 Reyting', wd:'💳 PUBG ID ga UC so‘rovi' };
      document.getElementById('drawer-title').innerText = titles[activeTab];
      const body = document.getElementById('drawer-body');
      if (activeTab === 'shop') body.innerHTML = renderGridHtml(WEAPONS, ownW, eqW, 'w');
      else if (activeTab === 'skins') body.innerHTML = renderGridHtml(SKINS, ownS, eqS, 's');
      else if (activeTab === 'garage') body.innerHTML = renderGridHtml(CARS, ownC, eqC, 'c');
      else if (activeTab === 'arena') {
        body.innerHTML = '<div style="font-size:12px;color:#94a3b8;margin-bottom:8px;">Raqib ustiga bosib duelga chiqing (Arena AI):</div>' +
          ARENA_BOTS.slice(0,25).map((b,i) =>
            '<div class="list-row" onclick="closeDrawer();startGame(' + i + ')">' +
            '<div><b>🟢 ' + b.name + '</b><div style="font-size:11px;color:#94a3b8;">' + SKINS[b.skin].name + ' • ' + WEAPONS[b.weapon].name + '</div></div>' +
            '<span style="background:#ef4444;padding:5px 10px;border-radius:8px;font-weight:700;font-size:11px;">⚔️ Urush</span></div>'
          ).join('');
      } else if (activeTab === 'top') {
        const all = [...ARENA_BOTS, { name: playerName + ' (Siz)', kills: totalKills, uc: uc, me: true }].sort((a,b)=>b.uc-a.uc).slice(0,100);
        body.innerHTML = all.map((p,i) =>
          '<div class="list-row" style="' + (p.me ? 'border-color:#22c55e;background:rgba(34,197,94,0.16);' : '') + '">' +
          '<div><b>#' + (i+1) + ' ' + p.name + '</b></div>' +
          '<div style="font-size:12px;">☠️ ' + p.kills + ' | 💵 <b>' + p.uc.toLocaleString() + ' UC</b></div></div>'
        ).join('');
      } else if (activeTab === 'wd') {
        body.innerHTML = '<div style="font-size:12px;color:#94a3b8;margin-bottom:8px;">O‘yindagi UC — virtual valyuta. Admin qo‘lda sovrin yuborishi uchun PUBG ID kiriting:</div>' +
          '<input class="wd-inp" type="number" id="pubg-id" placeholder="PUBG ID (masalan: 5123456789)" />' +
          '<input class="wd-inp" type="number" id="wd-amt" placeholder="UC miqdori (kamida 100)" />' +
          '<button class="btn-pubg" style="width:100%;font-size:15px;" onclick="sendWd()">📩 So‘rov yuborish</button>' +
          '<div id="wd-msg" style="margin-top:8px;font-size:12px;color:#86efac;"></div>';
      }
    }

    function buyItem(type, id) {
      const dict = type==='w' ? WEAPONS : (type==='s' ? SKINS : CARS);
      const own = type==='w' ? ownW : (type==='s' ? ownS : ownC);
      const item = dict[id];
      if (!own.includes(id)) {
        if (uc < item.price) { alert('❌ UC yetarli emas! Kerak: ' + item.price.toLocaleString() + ' UC'); return; }
        uc -= item.price; own.push(id);
      }
      if (type==='w') eqW = id; if (type==='s') eqS = id; if (type==='c') eqC = id;
      saveAll(); renderDrawer();
    }

    function sendWd() {
      const pid = document.getElementById('pubg-id').value.trim();
      const amt = Number(document.getElementById('wd-amt').value.trim());
      if (pid.length < 5 || amt < 100 || amt > uc) { alert('ID va miqdorni to‘g‘ri kiriting!'); return; }
      uc -= amt; saveAll();
      document.getElementById('wd-msg').innerText = '✅ So‘rov saqlandi! PUBG ID: ' + pid + ' | ' + amt + ' UC';
    }

    /* --- SCENIC PUBG LOBBY RENDERER --- */
    const lCanvas = document.getElementById('lobby-canvas');
    const lCtx = lCanvas.getContext('2d');
    let inBattle = false, lbT = 0;

    function drawLobby() {
      if (!inBattle) {
        if (lCanvas.width !== window.innerWidth || lCanvas.height !== window.innerHeight) {
          lCanvas.width = window.innerWidth; lCanvas.height = window.innerHeight;
        }
        const W = lCanvas.width, H = lCanvas.height;
